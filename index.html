    // ================= FORTUNE SNAKE / OX / RABBIT / DRAGON =================
    // Grade 3-4-3: reels[0] e reels[2] com 3 linhas; reels[1] com 4 linhas
    const F34_HEIGHTS = [3, 4, 3];
    const F34_LINES = [
      [0, 0, 0], [1, 1, 1], [2, 2, 2],
      [0, 1, 2], [2, 1, 0],
      [0, 2, 0], [2, 0, 2],
      [1, 0, 1], [1, 2, 1], [1, 3, 1]
    ];
    const F34_STRIP = ['🐍', '🐂', '🐰', '🐉', '💰', '🧧', '🪙', '🍊', '💎', '🧨'];
    const F34_PAY = { '🐍': 10, '🐂': 8, '🐰': 6, '🐉': 12, '💰': 5, '💎': 4, '🧧': 2.5, '🪙': 1.5, '🍊': 0.8, '🧨': 0.4 };
    const f34RollCol = (h, weights) => {
      const pool = weights || F34_STRIP;
      return Array.from({ length: h }, () => pool[Math.floor(Math.random() * pool.length)]);
    };
    const f34Eval = (g, payTable, wilds = ['🐍', '🐂', '🐰', '🐉']) => {
      const wins = []; let total = 0;
      F34_LINES.forEach((L, li) => {
        const syms = L.map((row, reel) => {
          const col = g[reel];
          if (!col || row >= col.length) return null;
          return col[row];
        });
        if (syms.some(s => s == null)) return;
        const base = syms.filter(x => !wilds.includes(x));
        let sym = null;
        if (base.length === 0) sym = wilds.includes(syms[0]) ? syms[0] : null;
        else if (base.every(x => x === base[0])) sym = base[0];
        if (sym && payTable[sym]) {
          wins.push({ li, sym, pay: payTable[sym], cells: L.map((row, reel) => [reel, row]) });
          total += payTable[sym];
        }
      });
      return { wins, total };
    };
    const f34Empty = () => F34_HEIGHTS.map(h => Array(h).fill('🧧'));

    // --- FORTUNE SNAKE ---
    const GameFortuneSnake = () => {

      const WEIGHTS = ['🍊','🍊','🍊','🧨','🧨','🪙','🪙','🧧','🧧','💰','💎','🐍','🐍'];

      const evalSnake = (g) => {
        const r = f34Eval(g, PAY, ['🐍']);
        const midWild = g[1] && g[1].every(c => c === '🐍');
        let total = r.total;
        if (midWild) total *= 10;

      const runStage = (stages, si, id, cost) => {

          }, 1500 + order * 1000);

        const endAt = fortuneStageDuration(spinIdx);
        later(() => {

      const spin = () => {

        setBusy(true); setWins([]); setLastWin(0); setCelebrate(null); setBanner(''); setCenterMult(1); setLocked([false, false, false]);

        const forceLoss = hackSettings.nextOutcome === 'loss';
        const bonusChance = bonusBet ? 0.28 : 0.14;
        let stages = [];
        if (forceLoss) {
          stages = [{ spinIdx: [0, 1, 2], grid: [['🍊','🧨','🪙'],['🧧','💰','🍊','🧨'],['💎','🪙','🧧']], lockMid: false }];
        } else if (forceWin) {
          stages = [{ spinIdx: [0, 1, 2], grid: [['🐍','🐍','🐍'],['🐍','🐍','🐍','🐍'],['🐍','🐍','🐍']], lockMid: false }];
        } else {
          let g = F34_HEIGHTS.map(h => f34RollCol(h, WEIGHTS));
          if (Math.random() < bonusChance) g[1] = Array(4).fill('🐍');
          stages.push({ spinIdx: [0, 1, 2], grid: g.map(c => [...c]), lockMid: false });
          const wildCount = (g[1] || []).filter(c => c === '🐍').length;
          if (wildCount >= 2 && wildCount < 4 && Math.random() < (bonusBet ? 0.55 : 0.35)) {
            const g2 = g.map(c => [...c]);
            g2[0] = f34RollCol(3, WEIGHTS);
            g2[2] = f34RollCol(3, WEIGHTS);
            if (Math.random() < 0.4) g2[1] = Array(4).fill('🐍');
            stages.push({ spinIdx: [0, 2], grid: g2, lockMid: true });
          }
        }
        runStage(stages, 0, id, cost);
      };

      const winSet = useMemo(() => {
        const s = new Set();
        wins.forEach(w => (w.cells || []).forEach(([reel, row]) => s.add(reel + ':' + row)));
        return s;
      }, [wins]);

      return (
        <FortuneShell title="FORTUNE SNAKE" icon="🐍" subtitle={banner || (busy ? 'A cobra está sorteando…' : '3-4-3 · 10 linhas · vol. baixa · máx. 5.000x')} celebrate={celebrate} lastWin={lastWin} rainKey={rainKey}>
          <FortuneReels34 grid={grid} spinning={spinning} winSet={winSet} wildSymbol="🐍" locked={locked} />
          <div className="ft-info">

          </div>
          <div className="ft-legend">
            {[['🐍','8x'],['💰','3,5x'],['💎','2,5x'],['🧧','1,6x'],['🪙','1x'],['🍊','0,6x']].map(([e,v]) => <span key={e} className="ft-chip">{e} {v}</span>)}

      const WEIGHTS = ['🍊','🧨','🪙','🧧','💰','💎','🐂','🧧','🪙','🍊'];

            sfx(hackSettings, 'ball_stop', 40);
          }, 1500 + order * 1000);
        });
        const endAt = fortuneStageDuration(spinIdx);
        later(() => {
          if (stages[si + 1]) later(() => runStage(stages, si + 1, id, stake, meta), 900);
          else {
            const final = st.grid;
            const ev = f34Eval(final, PAY, ['🐂']);
            const flat = final.flat();
            const allSame = flat.length && flat.every(s => s === flat[0]);
            let totalMult = ev.total;
            if (allSame) totalMult *= 10;

    const GameFortuneRabbit = () => {

        remove.forEach(([c, r]) => { ng[c][r] = null; });
        for (let c = 0; c < N; c++) {
          const kept = ng[c].filter(s => s != null);
          while (kept.length < N) kept.unshift(STRIP[Math.floor(Math.random()*STRIP.length)]);
          ng[c] = kept;
        }
        return ng;
      };

      const spinReels = (finalGrid, onDone) => {
        setSpinning([true,true,true,true,true]);
        sfx(hackSettings, 'slots');
        [0,1,2,3,4].forEach((reelIdx, order) => {
          later(() => {
            setGrid(prev => {
              const n = prev.map(c => [...c]);
              n[reelIdx] = [...finalGrid[reelIdx]];
              return n;
            });
            setSpinning(prev => prev.map((v, i) => i === reelIdx ? false : v));
            sfx(hackSettings, 'ball_stop', 40);
          }, 1500 + order * 1000);
        });
        later(onDone, 1500 + 4 * 1000 + 400);
      };

      const spin = () => {
        if (busy) return;
        const isFree = inBonus && freeLeft > 0;
        const amount = isFree ? freeStake.current : (Number(bet) || 10);
        const id = placeBet(isFree ? Math.min(0.01, amount) : amount, 'Prosperity Fortune Tree', isFree ? `Grátis (${freeLeft})` : `Aposta ${formatMoney(amount)}`);
        if (!id) return;
        if (!isFree) freeStake.current = amount;
        setBusy(true);
        setLastWin(0);
        setCelebrate(null);
        setHit(new Set());
        setBanner(isFree ? `Árvore grátis · multi ×${MULT_STEPS[Math.min(multIdx, MULT_STEPS.length-1)]}` : 'A árvore floresce…');
        if (!isFree) setMultIdx(0);
        let g = rollBoard();
        if (hackSettings.nextOutcome === 'win') {
          g = Array.from({ length: N }, (_, c) => Array.from({ length: N }, (_, r) => (r < 2) ? '🌳' : SYMS[(r+c) % SYMS.length]));
        } else if (hackSettings.nextOutcome === 'loss') {
          g = Array.from({ length: N }, (_, c) => Array.from({ length: N }, (_, r) => SYMS[(c*2+r) % SYMS.length]));
        }
        let mIdx = isFree ? multIdx : 0;
        spinReels(g, () => {
          let totalMult = 0;
          const run = (cur, depth) => {
            const clusters = findClusters(cur);
            if (!clusters.length || depth > 10) {
              const sc = countScatter(cur);
              const payout = Math.round(amount * totalMult * 100) / 100;
              settleBet(id, payout, totalMult > 0 ? `Prosperity Tree ${totalMult.toFixed(1)}x` : 'Prosperity Tree: sem prêmio');
              setLastWin(payout);
              setMultIdx(mIdx);
              setSpinning([false,false,false,false,false]);
              if (payout > 0) {
                setCelebrate(totalMult >= 20 ? 'mega' : totalMult >= 6 ? 'big' : 'win');
                setRainKey(k => k + 1);
                sfx(hackSettings, 'win');
                later(() => setCelebrate(null), 2600);
              } else sfx(hackSettings, 'loss');
              if (!isFree && sc >= 3) {
                setInBonus(true);
                setFreeLeft(8);
                setBanner('🌟 8 rodadas grátis! Multiplicador preservado');
                setBusy(false);
                return;
              }
              if (isFree) {
                const left = freeLeft - 1;
                setFreeLeft(left);
                if (left <= 0) {
                  setInBonus(false);
                  setMultIdx(0);
                  setBanner('Bônus encerrado');
                }
                setBusy(false);
                return;
              }
              setMultIdx(0);
              setBusy(false);
              setBanner('');
              return;
            }
            const remove = [];
            clusters.forEach(cl => {
              const n = Math.min(cl.cells.length, 6);
              const basePay = (PAY[cl.sym] && PAY[cl.sym][n]) ? PAY[cl.sym][n] : 1;
              totalMult += basePay * MULT_STEPS[Math.min(mIdx, MULT_STEPS.length - 1)];
              cl.cells.forEach(p => remove.push(p));
            });
            mIdx = Math.min(mIdx + 1, MULT_STEPS.length - 1);
            setMultIdx(mIdx);
            setHit(new Set(remove.map(([c, r]) => key(c, r))));
            later(() => {
              const next = cascade(cur, remove);
              setGrid(next);
              setHit(new Set());
              later(() => run(next, depth + 1), 280);
            }, 420);
          };
          run(g, 0);
        });
      };

      return (
        <FortuneShell title="PROSPERITY TREE" icon="🌳" subtitle={banner || (busy ? 'Cascata da fortuna…' : '5×5 cluster · multi progressivo · Free Spins')} celebrate={celebrate} lastWin={lastWin} rainKey={rainKey}>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}>
            <span className="ft-chip">MULTI ×{MULT_STEPS[Math.min(multIdx, MULT_STEPS.length-1)]}</span>
            {inBonus && <span className="ft-chip" style={{ borderColor: 'rgba(244,217,120,.7)', color: '#f4d978' }}>GRÁTIS {freeLeft}</span>}
          </div>
          <div className="ft-board" style={{ gap: 5 }}>
            {grid.map((col, ci) => (
              <div key={ci} className="ft-reel" style={{ height: 'calc(var(--ftc) * 5 + 2px)', width: 54 }}>
                {spinning[ci] ? (
                  <div className="ft-strip" style={{ animationDelay: (-ci * 0.12) + 's' }}>
                    {[...STRIP, ...STRIP, ...STRIP, ...STRIP].map((sym, i) => (
                      <div key={i} className="ft-cell" style={{ fontSize: 'calc(var(--ftc)*.42)' }}>{sym}</div>
                    ))}
                  </div>
                ) : col.map((sym, r) => {
                  const k = key(ci, r);
                  const isHit = hit.has(k);
                  return (
                    <div key={r} className={cn('ft-cell', isHit && 'ft-hit')} style={{
                      fontSize: 'calc(var(--ftc)*.42)',
                      border: sym === SCATTER ? '2px solid #f1d77a' : undefined
                    }}>{sym}</div>
                  );
                })}
              </div>
            ))}
          </div>
          <div className="ft-info">
            {lastWin > 0
              ? <span className="ft-wintext">+ {formatMoney(lastWin)}</span>
              : <span className="ft-muted">{busy ? 'Cascata…' : 'Cascata sobe o multi · 🌟 3+ = Free Spins'}</span>}
          </div>
          <div className="ft-legend">
            {[['🌳','top'],['🌟','scatter'],['1→2→3→5→8x','multi'],['5+','cluster']].map(([e,v]) => <span key={e} className="ft-chip">{e} {v}</span>)}
          </div>
          <div className="ft-note">No bônus o multiplicador acumula entre os giros. No jogo base ele zera ao fim da rodada.</div>
          <div className="space-y-3 mt-3">
            <BetInput value={bet} onChange={setBet} disabled={busy || inBonus} />
            <button className="ft-spin" onClick={spin} disabled={busy}>{busy ? 'GIRANDO…' : (inBonus ? `GRÁTIS (${freeLeft})` : 'GIRAR')}</button>
          </div>
        </FortuneShell>
      );
    };

    // ================= GATES OF OLYMPUS (6x5 Pay Anywhere + Cascade + Multipliers + Free Spins) =================
    const GOO_COLS = 6;
    const GOO_ROWS = 5;
    const GOO_PAY_SYMS = ['👑', '💍', '🏺', '⏳', '💎', '🔴', '🔵', '🟢', '🟡'];
    const GOO_SCATTER = '🧔';
    const GOO_MULT = '⚡';
    const GOO_STRIP = [...GOO_PAY_SYMS, GOO_SCATTER, GOO_MULT, ...GOO_PAY_SYMS];
    const GOO_PAY = {
      '👑': [8, 20, 40],
      '💍': [5, 12, 25],
      '🏺': [3.5, 8, 18],
      '⏳': [2.5, 6, 12],
      '💎': [2, 4.5, 10],
      '🔴': [1.2, 2.5, 5],
      '🔵': [1, 2, 4],
      '🟢': [0.8, 1.6, 3.5],
      '🟡': [0.5, 1.2, 3]
    };

    const gooRandSym = (anteOn) => {
      const scatterW = anteOn ? 7 : 3.5;
      const multW = 3.5;
      const weights = [
        ['👑', 5], ['💍', 6], ['🏺', 7], ['⏳', 8], ['💎', 9],
        ['🔴', 12], ['🔵', 12], ['🟢', 13], ['🟡', 14],
        [GOO_SCATTER, scatterW], [GOO_MULT, multW]
      ];
      let total = weights.reduce((s, w) => s + w[1], 0);
      let r = Math.random() * total;
      let pick = '🟡';
      for (const [sym, w] of weights) {
        r -= w;
        if (r <= 0) { pick = sym; break; }
      }
      if (pick === GOO_MULT) {
        const x = Math.random();
        let v = 2;
        if (x < 0.32) v = 2;
        else if (x < 0.52) v = 3;
        else if (x < 0.68) v = 5;
        else if (x < 0.78) v = 8;
        else if (x < 0.86) v = 10;
        else if (x < 0.91) v = 15;
        else if (x < 0.945) v = 20;
        else if (x < 0.97) v = 25;
        else if (x < 0.985) v = 50;
        else if (x < 0.995) v = 100;
        else if (x < 0.999) v = 250;
        else v = 500;
        return { sym: GOO_MULT, mult: v };
      }
      return { sym: pick, mult: 0 };
    };

    const gooEmptyGrid = () => Array.from({ length: GOO_COLS }, () =>
      Array.from({ length: GOO_ROWS }, () => gooRandSym(false))
    );

    const gooCountPays = (grid) => {
      const counts = {};
      for (let c = 0; c < GOO_COLS; c++) {
        for (let r = 0; r < GOO_ROWS; r++) {
          const cell = grid[c][r];
          if (!cell || !cell.sym || cell.sym === GOO_SCATTER || cell.sym === GOO_MULT) continue;
          counts[cell.sym] = (counts[cell.sym] || 0) + 1;
        }
      }
      const wins = [];
      Object.entries(counts).forEach(([sym, n]) => {
        if (n < 8) return;
        const table = GOO_PAY[sym];
        if (!table) return;
        const tier = n >= 12 ? 2 : n >= 10 ? 1 : 0;
        wins.push({ sym, count: n, mult: table[tier] });
      });
      return wins;
    };

    const gooCountScatter = (grid) => {
      let n = 0;
      for (let c = 0; c < GOO_COLS; c++)
        for (let r = 0; r < GOO_ROWS; r++)
          if (grid[c][r] && grid[c][r].sym === GOO_SCATTER) n++;
      return n;
    };

    const gooSumMults = (grid) => {
      let s = 0;
      for (let c = 0; c < GOO_COLS; c++)
        for (let r = 0; r < GOO_ROWS; r++) {
          const cell = grid[c][r];
          if (cell && cell.sym === GOO_MULT && cell.mult > 0) s += cell.mult;
        }
      return s;
    };

    const gooRemoveWins = (grid, wins) => {
      const winSet = new Set(wins.map(w => w.sym));
      return grid.map(col => col.map(cell => (cell && winSet.has(cell.sym)) ? null : cell));
    };

    const gooCascade = (grid, anteOn) => grid.map(col => {
      const kept = col.filter(Boolean);
      while (kept.length < GOO_ROWS) kept.unshift(gooRandSym(anteOn));
      return kept.slice(0, GOO_ROWS);
    });

    const GameGatesOfOlympus = () => {
      const { placeBet, settleBet, hackSettings, balance, setBalance, showNotification } = useAppState();
      const [bet, setBet] = useState(10);
      const [ante, setAnte] = useState(false);
      const [grid, setGrid] = useState(() => gooEmptyGrid());
      const [busy, setBusy] = useState(false);
      const [lastWin, setLastWin] = useState(0);
      const [roundWin, setRoundWin] = useState(0);
      const [status, setStatus] = useState('8+ símbolos iguais em qualquer lugar da grade.');
      const [freeSpins, setFreeSpins] = useState(0);
      const [globalMult, setGlobalMult] = useState(0);
      const [inBonus, setInBonus] = useState(false);
      const [celebrate, setCelebrate] = useState(null);
      const [highlight, setHighlight] = useState(() => new Set());
      const [spinning, setSpinning] = useState(false);
      const [spinningCols, setSpinningCols] = useState(() => Array(GOO_COLS).fill(false));
      const [cellFx, setCellFx] = useState({}); // key -> 'land'|'fall'|'drop'
      const busyRef = useRef(false);
      const freeRef = useRef(0);
      const globalRef = useRef(0);
      const anteRef = useRef(false);
      const betRef = useRef(10);
      freeRef.current = freeSpins;
      globalRef.current = globalMult;
      anteRef.current = ante;
      betRef.current = bet;

      const baseBet = () => Math.max(1, Number(betRef.current) || 1);
      const cost = () => {
        const b = baseBet();
        return anteRef.current ? Math.round(b * 1.25 * 100) / 100 : b;
      };
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));

      const paint = (g) => setGrid(g.map(col => col.map(c => c ? { ...c } : { sym: '', mult: 0 })));

      const runRound = async (isFree, betId) => {
        setHighlight(new Set());
        setRoundWin(0);
        setCellFx({});
        setSpinning(true);
        sfx(hackSettings, 'slots');

        // Sorteia resultado antes (igual Sugar / Fortune)
        let g = Array.from({ length: GOO_COLS }, () =>
          Array.from({ length: GOO_ROWS }, () => gooRandSym(anteRef.current))
        );
        if (hackSettings.nextOutcome === 'win') {
          const sym = GOO_PAY_SYMS[Math.floor(Math.random() * 3)];
          let placed = 0;
          for (let c = 0; c < GOO_COLS && placed < 10; c++) {
            for (let r = 0; r < GOO_ROWS && placed < 10; r++) {
              if (Math.random() < 0.55) { g[c][r] = { sym, mult: 0 }; placed++; }
            }
          }
        } else if (hackSettings.nextOutcome === 'loss') {
          for (let c = 0; c < GOO_COLS; c++)
            for (let r = 0; r < GOO_ROWS; r++)
              g[c][r] = { sym: GOO_PAY_SYMS[(c + r * 2) % GOO_PAY_SYMS.length], mult: 0 };
        }
        paint(g);

        // Rolo por coluna — mesmo ritmo do Sugar Rush
        setSpinningCols(Array(GOO_COLS).fill(true));
        await sleep(1200);
        for (let c = 0; c < GOO_COLS; c++) {
          setSpinningCols(prev => {
            const n = prev.slice();
            n[c] = false;
            return n;
          });
          sfx(hackSettings, 'ball_stop', 40);
          if (c < GOO_COLS - 1) await sleep(380);
        }
        setSpinningCols(Array(GOO_COLS).fill(false));
        setSpinning(false);
        await sleep(160);
        setCellFx({});

        let cascadeWin = 0;
        let anyWin = false;
        let maxSc = gooCountScatter(g);
        let cascade = 0;

        while (true) {
          const wins = gooCountPays(g);
          maxSc = Math.max(maxSc, gooCountScatter(g));
          if (!wins.length) break;
          anyWin = true;
          const step = wins.reduce((s, w) => s + w.mult * baseBet(), 0);
          cascadeWin += step;

          const hs = new Set();
          wins.forEach(w => {
            for (let c = 0; c < GOO_COLS; c++)
              for (let r = 0; r < GOO_ROWS; r++)
                if (g[c][r] && g[c][r].sym === w.sym) hs.add(c + ',' + r);
          });
          setHighlight(hs);
          setRoundWin(cascadeWin);
          setStatus(wins.map(w => `${w.count}×${w.sym}`).join('  ') + `  +${formatMoney(step)}`);
          sfx(hackSettings, 'win');
          await sleep(520);

          // explode e preenche de uma vez (sem grade pela metade)
          const fallFx = {};
          hs.forEach(k => { fallFx[k] = 'fall'; });
          setCellFx(fallFx);
          await sleep(240);

          g = gooRemoveWins(g, wins);
          g = gooCascade(g, anteRef.current);
          setHighlight(new Set());
          const dropFx = {};
          for (let c = 0; c < GOO_COLS; c++)
            for (let r = 0; r < GOO_ROWS; r++) dropFx[c + ',' + r] = 'drop';
          paint(g);
          setCellFx(dropFx);
          cascade++;
          sfx(hackSettings, 'dice');
          await sleep(300);
          setCellFx({});
          if (cascade > 30) break;
        }

        let appliedMult = 1;
        const multSum = gooSumMults(g);
        if (anyWin) {
          if (isFree) {
            if (multSum > 0) {
              globalRef.current += multSum;
              setGlobalMult(globalRef.current);
            }
            if (globalRef.current > 0) {
              appliedMult = globalRef.current;
              cascadeWin *= appliedMult;
            }
          } else if (multSum > 0) {
            appliedMult = multSum;
            cascadeWin *= appliedMult;
          }
          if (appliedMult > 1) {
            setRoundWin(cascadeWin);
            setStatus(`×${appliedMult}  ·  ${formatMoney(cascadeWin)}`);
            await sleep(450);
          }
        }

        maxSc = Math.max(maxSc, gooCountScatter(g));
        if (!isFree && maxSc >= 4) {
          freeRef.current += 15;
          setFreeSpins(freeRef.current);
          setInBonus(true);
          globalRef.current = 0;
          setGlobalMult(0);
          setStatus(`${maxSc} Scatters! +15 Free Spins`);
          sfx(hackSettings, 'blackjack');
          await sleep(750);
        } else if (isFree && maxSc >= 3) {
          freeRef.current += 5;
          setFreeSpins(freeRef.current);
          setStatus(`Retrigger! +5 FS (${freeRef.current} restantes)`);
          sfx(hackSettings, 'win');
          await sleep(550);
        }

        setLastWin(cascadeWin);
        if (cascadeWin > 0) {
          const ratio = cascadeWin / baseBet();
          setCelebrate(ratio >= 40 ? 'mega' : ratio >= 12 ? 'big' : 'win');
          setTimeout(() => setCelebrate(null), 2200);
        }

        if (betId) {
          settleBet(betId, cascadeWin, cascadeWin > 0
            ? `Gates ${formatMoney(cascadeWin)}${appliedMult > 1 ? ` (${appliedMult}x)` : ''}`
            : 'Gates — sem vitória');
        } else if (cascadeWin > 0) {
          if (!hackSettings.frozenBalance) setBalance(prev => Math.round((prev + cascadeWin) * 100) / 100);
          showNotification && showNotification(`Free Spin +${formatMoney(cascadeWin)}`, 'success');
        }
        return cascadeWin;
      };

      const spin = async (buyBonus = false) => {
        if (busyRef.current) return;
        const isFree = freeRef.current > 0 && !buyBonus;
        const stake = buyBonus ? Math.round(baseBet() * 100 * 100) / 100 : cost();
        if (!isFree && stake > balance) {
          showNotification && showNotification('Saldo insuficiente', 'error');
          return;
        }
        busyRef.current = true;
        setBusy(true);
        setCelebrate(null);
        setLastWin(0);
        setRoundWin(0);

        let betId = null;
        if (!isFree) {
          betId = placeBet(stake, 'Gates of Olympus', buyBonus ? 'Compra Bônus 100×' : (anteRef.current ? `Ante ${formatMoney(stake)}` : `Giro ${formatMoney(stake)}`));
          if (!betId) {
            busyRef.current = false;
            setBusy(false);
            return;
          }
        }

        try {
          if (buyBonus) {
            if (betId) settleBet(betId, 0, 'Compra de 15 Free Spins');
            freeRef.current = 15;
            setFreeSpins(15);
            setInBonus(true);
            globalRef.current = 0;
            setGlobalMult(0);
            setStatus('Bônus comprado — 15 Free Spins');
            await sleep(400);
            while (freeRef.current > 0) {
              freeRef.current -= 1;
              setFreeSpins(freeRef.current);
              await runRound(true, null);
              await sleep(280);
            }
            setInBonus(false);
            globalRef.current = 0;
            setGlobalMult(0);
            setStatus('Fim das Rodadas Grátis');
          } else {
            if (isFree) {
              freeRef.current = Math.max(0, freeRef.current - 1);
              setFreeSpins(freeRef.current);
            }
            await runRound(isFree, isFree ? null : betId);
            if (freeRef.current > 0) {
              setInBonus(true);
              while (freeRef.current > 0) {
                freeRef.current -= 1;
                setFreeSpins(freeRef.current);
                await runRound(true, null);
                await sleep(280);
              }
              setInBonus(false);
              globalRef.current = 0;
              setGlobalMult(0);
              setStatus('Fim das Rodadas Grátis');
            }
          }
        } finally {
          busyRef.current = false;
          setBusy(false);
          setHighlight(new Set());
        }
      };

      return (
        <div className="goo-wrap">
          <div className="goo-zeus">⚡</div>
          <div className="goo-title">GATES OF OLYMPUS</div>
          <div className="goo-sub">Pay Anywhere · Cascata · Multiplicadores</div>

          <div className="goo-badges">
            {(inBonus || freeSpins > 0) ? (
              <span className="goo-badge bonus">FS {freeSpins} · GLOBAL {globalMult}x</span>
            ) : (
              <span className="goo-badge">Modo normal</span>
            )}
            {roundWin > 0 && <span className="goo-badge win">{formatMoney(roundWin)}</span>}
          </div>

          <div className={cn('goo-board', spinning && 'is-spinning')}>
            {Array.from({ length: GOO_COLS }, (_, c) => (
              <div key={c} className={cn('goo-col', spinningCols[c] && 'is-spinning')}>
                {spinningCols[c] ? (
                  <div className="goo-strip" style={{ animationDelay: `${-c * 0.17}s` }}>
                    {[...GOO_STRIP, ...GOO_STRIP, ...GOO_STRIP].map((sym, i) => (
                      <div key={i} className="goo-cell goo-cell-spin">{sym}</div>
                    ))}
                  </div>
                ) : (
                  Array.from({ length: GOO_ROWS }, (_, r) => {
                    const key = c + ',' + r;
                    const cell = grid[c] && grid[c][r];
                    const isHit = highlight.has(key);
                    const isMult = cell && cell.sym === GOO_MULT;
                    const isSc = cell && cell.sym === GOO_SCATTER;
                    const empty = !cell || !cell.sym;
                    const fx = cellFx[key];
                    return (
                      <div
                        key={key}
                        className={cn(
                          'goo-cell goo-land',
                          isHit && 'is-hit',
                          isMult && 'is-mult',
                          isSc && 'is-sc',
                          empty && 'is-empty',
                          fx === 'fall' && 'is-fall',
                          fx === 'drop' && 'is-drop'
                        )}
                      >
                        <span>{empty ? '' : cell.sym}</span>
                        {isMult && cell.mult > 0 && <span className="goo-mval">{cell.mult}x</span>}
                      </div>
                    );
                  })
                )}
              </div>
            ))}
          </div>

          <div className={cn('goo-status', lastWin > 0 && !busy && 'wintext')}>
            {busy ? status : (lastWin > 0 ? `+ ${formatMoney(lastWin)}` : status)}
          </div>

          <div className="goo-legend">
            {[['👑', '40x'], ['💍', '25x'], ['🏺', '18x'], ['💎', '10x'], ['⚡', 'mult'], ['🧔', 'FS']].map(([e, v]) => (
              <span key={e + v} className="goo-chip">{e} {v}</span>
            ))}
          </div>

          <div className="goo-controls">
            <BetInput value={bet} onChange={setBet} disabled={busy || freeSpins > 0} />
            <div className="goo-ante-row">
              <button type="button" disabled={busy || freeSpins > 0} onClick={() => setAnte(v => !v)} className={cn('goo-ante', ante && 'on')}>

    // Cor dominante do emoji (lida de um canvas) -> usada no brilho do card via --c
    const __emojiColorCache = {};
    const emojiRGB = (emoji) => {
      if (emoji in __emojiColorCache) return __emojiColorCache[emoji];
      let result = null;
      try {
        const S = 96, cv = document.createElement('canvas');
        cv.width = cv.height = S;
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.font = '72px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(emoji, S / 2, S / 2 + 4);
        const d = ctx.getImageData(0, 0, S, S).data;
        const BINS = 24, w = new Array(BINS).fill(0), sr = new Array(BINS).fill(0), sg = new Array(BINS).fill(0), sb = new Array(BINS).fill(0);
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 200) continue;
          const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, c = mx - mn;
          if (c < 0.18 || l < 0.12 || l > 0.93) continue;
          const s = c / (1 - Math.abs(2 * l - 1) || 1);
          let h = mx === r ? ((g - b) / c) % 6 : mx === g ? (b - r) / c + 2 : (r - g) / c + 4;
          h = (h * 60 + 360) % 360;
          const bin = Math.floor(h / (360 / BINS)) % BINS, wt = s * c;
          w[bin] += wt; sr[bin] += d[i] * wt; sg[bin] += d[i + 1] * wt; sb[bin] += d[i + 2] * wt;
        }
        let best = -1, bestW = 0;
        for (let k = 0; k < BINS; k++) {
          const tw = w[k] + 0.5 * (w[(k + 1) % BINS] + w[(k + BINS - 1) % BINS]);
          if (tw > bestW) { bestW = tw; best = k; }
        }
        if (best >= 0 && bestW > 6) {
          let R = 0, G = 0, B = 0, W = 0;
          for (const k of [best, (best + 1) % BINS, (best + BINS - 1) % BINS]) { R += sr[k]; G += sg[k]; B += sb[k]; W += w[k]; }
          let r = R / W / 255, g = G / W / 255, b = B / W / 255;
          // deixa a cor vibrante e clara o bastante para brilhar no fundo escuro
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          const L = (mx + mn) / 2, k = L < 0.5 ? 0.5 / Math.max(L, 0.05) : 1;
          r = Math.min(1, r * k); g = Math.min(1, g * k); b = Math.min(1, b * k);
          const m = (r + g + b) / 3, sat = 1.25;
          r = Math.min(1, Math.max(0, m + (r - m) * sat)); g = Math.min(1, Math.max(0, m + (g - m) * sat)); b = Math.min(1, Math.max(0, m + (b - m) * sat));
          result = Math.round(r * 255) + ',' + Math.round(g * 255) + ',' + Math.round(b * 255);
        }
      } catch (e) { }
      __emojiColorCache[emoji] = result;
      return result;

      { id: 'collect_void_crown', icon: '👑', name: 'Coroa do Vazio', tag: 'Colecionável', desc: 'Uma coroa cósmica de coleção, reservada a quem domina a mesa.', kind: 'collectible', chipPrice: 42000, cashPrice: 14000, rarity: 'Relíquia Suprema', achievement: { game: 'Blackjack', wins: 5 } },
      { id: 'collect_galaxy_ship', icon: '🛸', name: 'Arca Galáctica', tag: 'Colecionável', desc: 'Nave-museu colossal, uma das peças mais raras do mercado.', kind: 'collectible', chipPrice: 0, cashPrice: 18000, rarity: 'Relíquia Suprema', achievement: { game: 'Roleta Europeia', wins: 5 } },

    ];



    // ========== SUGAR RUSH (Cluster 7x7) ==========
    const SR_ROWS = 7, SR_COLS = 7;
    const SR_SYMS = ['🍭', '🍬', '🧁', '🍩', '🍪', '🍫', '🫐'];
    const SR_SCATTER = '⭐';
    const SR_STRIP = [...SR_SYMS, SR_SCATTER, ...SR_SYMS];
    const SR_PAY = { 5: 0.25, 6: 0.5, 7: 0.8, 8: 1.2, 9: 2, 10: 3, 11: 4.5, 12: 6, 13: 8, 14: 12, 15: 18, 20: 30, 25: 50, 30: 80, 35: 120, 49: 200 };
    const srPayFor = (n) => {
      if (n < 5) return 0;
      let p = SR_PAY[5];
      Object.keys(SR_PAY).map(Number).sort((a, b) => a - b).forEach(k => { if (n >= k) p = SR_PAY[k]; });
      return p;
    };
    const srEmptyMarks = () => Array.from({ length: SR_COLS }, () => Array.from({ length: SR_ROWS }, () => 0));
    const srRandSym = (boostScatter = false) => {
      if (Math.random() < (boostScatter ? 0.06 : 0.035)) return SR_SCATTER;
      return SR_SYMS[Math.floor(Math.random() * SR_SYMS.length)];
    };
    const srFillGrid = (boost = false) => Array.from({ length: SR_COLS }, () =>
      Array.from({ length: SR_ROWS }, () => srRandSym(boost))
    );
    const srFindClusters = (grid) => {
      const seen = Array.from({ length: SR_COLS }, () => Array(SR_ROWS).fill(false));
      const clusters = [];
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let c = 0; c < SR_COLS; c++) {
        for (let r = 0; r < SR_ROWS; r++) {
          if (seen[c][r]) continue;
          const sym = grid[c][r];
          if (!sym || sym === SR_SCATTER) { seen[c][r] = true; continue; }
          const cells = [];
          const stack = [[c, r]];
          seen[c][r] = true;
          while (stack.length) {
            const [x, y] = stack.pop();
            cells.push([x, y]);
            for (const [dx, dy] of dirs) {
              const nx = x + dx, ny = y + dy;
              if (nx < 0 || ny < 0 || nx >= SR_COLS || ny >= SR_ROWS) continue;
              if (seen[nx][ny] || grid[nx][ny] !== sym) continue;
              seen[nx][ny] = true;
              stack.push([nx, ny]);
            }
          }
          if (cells.length >= 5) clusters.push({ sym, cells });
        }
      }
      return clusters;
    };
    const srCountScatter = (grid) => {
      let n = 0;
      for (let c = 0; c < SR_COLS; c++) for (let r = 0; r < SR_ROWS; r++) if (grid[c][r] === SR_SCATTER) n++;
      return n;
    };
    const srCascade = (grid) => {
      const next = grid.map(col => col.slice());
      for (let c = 0; c < SR_COLS; c++) {
        const kept = next[c].filter(s => s !== null && s !== '');
        while (kept.length < SR_ROWS) kept.unshift(srRandSym(false));
        next[c] = kept;
      }
      return next;
    };

    const GameSugarRush = () => {
      const { placeBet, settleBet, hackSettings, balance } = useAppState();
      const [bet, setBet] = useState(10);
      const [grid, setGrid] = useState(() => srFillGrid());
      const [marks, setMarks] = useState(() => srEmptyMarks());
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState('Forme grupos de 5+ iguais (↑↓←→). Cascata e mult. de posição.');
      const [roundWin, setRoundWin] = useState(0);
      const [freeSpins, setFreeSpins] = useState(0);
      const [inBonus, setInBonus] = useState(false);
      const [highlight, setHighlight] = useState(() => new Set());
      const [spinningCols, setSpinningCols] = useState(() => Array(SR_COLS).fill(false));
      const [cellFx, setCellFx] = useState({});
      const freeRef = useRef(0);
      const marksRef = useRef(srEmptyMarks());
      const betRef = useRef(10);
      freeRef.current = freeSpins;
      betRef.current = bet;
      marksRef.current = marks;
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      const paint = (g) => setGrid(g.map(col => col.slice()));

      const spinIn = async () => {
        // Mesmo ritmo do Fortune / caça-níquel: todos giram, param em cascata L→R
        setSpinningCols(Array(SR_COLS).fill(true));
        sfx(hackSettings, 'slots');
        // base ~900ms (igual Fortune), depois +280ms por coluna
        await sleep(1200);
        for (let c = 0; c < SR_COLS; c++) {
          setSpinningCols(prev => {
            const n = prev.slice();
            n[c] = false;
            return n;
          });
          sfx(hackSettings, 'ball_stop', 40);
          if (c < SR_COLS - 1) await sleep(380);
        }
        setSpinningCols(Array(SR_COLS).fill(false));
        await sleep(160);
      };

      const runRound = async (isFree) => {
        setHighlight(new Set());
        setRoundWin(0);
        setCellFx({});

        // Sorteia o resultado antes de animar — ao parar cada rolo já mostra o símbolo final
        let g = srFillGrid(isFree);
        if (hackSettings.nextOutcome === 'win') {
          const sym = SR_SYMS[Math.floor(Math.random() * 3)];
          for (let i = 0; i < 7; i++) {
            const c = i % SR_COLS, r = 2 + Math.floor(i / SR_COLS);
            if (r < SR_ROWS) g[c][r] = sym;
          }
        } else if (hackSettings.nextOutcome === 'loss') {
          for (let c = 0; c < SR_COLS; c++)
            for (let r = 0; r < SR_ROWS; r++)
              g[c][r] = SR_SYMS[(c + r * 3) % SR_SYMS.length];
        }
        paint(g);
        await spinIn();
        // land já vem do CSS .sr-land / ftLand — sem segundo efeito extra
        setCellFx({});

        let localMarks = isFree ? marksRef.current.map(col => col.slice()) : srEmptyMarks();
        let cascadeWin = 0, cascade = 0, maxSc = srCountScatter(g);

        while (true) {
          const clusters = srFindClusters(g);
          if (!clusters.length) break;
          const hs = new Set();
          let stepPay = 0;
          for (const cl of clusters) {
            let multSum = 0;
            for (const [c, r] of cl.cells) {
              hs.add(c + ',' + r);
              if (localMarks[c][r] === 0) { localMarks[c][r] = 1; multSum += 1; }
              else { localMarks[c][r] = Math.min(128, localMarks[c][r] * 2); multSum += localMarks[c][r]; }
            }
            stepPay += srPayFor(cl.cells.length) * (Number(betRef.current) || 1) * Math.max(1, multSum);
          }
          setMarks(localMarks.map(col => col.slice()));
          marksRef.current = localMarks;
          setHighlight(hs);
          cascadeWin += stepPay;
          setRoundWin(cascadeWin);
          setStatus(clusters.map(cl => `${cl.cells.length}×${cl.sym}`).join('  ') + `  +${formatMoney(stepPay)}`);
          sfx(hackSettings, 'win');
          await sleep(500);
          const fallFx = {};
          hs.forEach(k => { fallFx[k] = 'fall'; });
          setCellFx(fallFx);
          await sleep(240);
          // Remove e preenche de uma vez — evita grade "pela metade"
          for (const cl of clusters) for (const [c, r] of cl.cells) g[c][r] = null;
          g = srCascade(g);
          setHighlight(new Set());
          const dropFx = {};
          for (let c = 0; c < SR_COLS; c++) for (let r = 0; r < SR_ROWS; r++) dropFx[c + ',' + r] = 'drop';
          paint(g);
          setCellFx(dropFx);
          cascade++;
          sfx(hackSettings, 'dice');
          await sleep(280);
          setCellFx({});
          maxSc = Math.max(maxSc, srCountScatter(g));
          if (cascade > 40) break;
        }

        if (!isFree) {
          localMarks = srEmptyMarks();
          setMarks(localMarks);
          marksRef.current = localMarks;
        }
        if (!isFree && maxSc >= 3) {
          const fs = maxSc >= 5 ? 15 : maxSc >= 4 ? 12 : 10;
          freeRef.current += fs;
          setFreeSpins(freeRef.current);
          setInBonus(true);
          setStatus(`${maxSc} Scatters! +${fs} Free Spins (marcas acumulam)`);
          sfx(hackSettings, 'blackjack');
          await sleep(700);
        } else if (isFree && maxSc >= 3) {
          freeRef.current += 5;
          setFreeSpins(freeRef.current);
          setStatus(`Retrigger! +5 FS (${freeRef.current} restantes)`);
          sfx(hackSettings, 'win');
          await sleep(500);
        }
        if (cascadeWin > 0) setStatus(`Ganho da rodada: ${formatMoney(cascadeWin)}`);
        else setStatus(s => String(s).includes('Scatter') ? s : 'Sem cluster. Tente de novo.');
        return cascadeWin;
      };

      const play = async (buyBonus = false) => {
        if (busy) return;
        const b = Math.max(1, Number(bet) || 1);
        const cost = buyBonus ? b * 100 : b;
        if (!(hackSettings && hackSettings.infiniteBalance) && balance < cost) return;
        setBusy(true);
        const id = placeBet(cost, buyBonus ? 'Sugar Rush (Bônus)' : 'Sugar Rush', buyBonus ? 'Compra bônus 100×' : `Aposta ${formatMoney(b)}`);
        if (!id) { setBusy(false); return; }
        let total = 0;
        if (buyBonus) {
          setInBonus(true);
          freeRef.current = 10;
          setFreeSpins(10);
          setMarks(srEmptyMarks());
          marksRef.current = srEmptyMarks();
          setStatus('Bônus! 10 Free Spins — marcas acumulam entre giros.');
          await sleep(350);
          while (freeRef.current > 0) {
            freeRef.current -= 1;
            setFreeSpins(freeRef.current);
            total += await runRound(true);
            await sleep(180);
          }
          setInBonus(false);
          setMarks(srEmptyMarks());
          marksRef.current = srEmptyMarks();
        } else {
          total += await runRound(false);
          while (freeRef.current > 0) {
            setInBonus(true);
            freeRef.current -= 1;
            setFreeSpins(freeRef.current);
            total += await runRound(true);
            await sleep(180);
          }
          setInBonus(false);
          setMarks(srEmptyMarks());
          marksRef.current = srEmptyMarks();
        }
        settleBet(id, total, total > 0 ? `Sugar Rush +${formatMoney(total)}` : 'Sugar Rush — sem ganho');
        setBusy(false);
      };

      return (
        <div className="sr-wrap space-y-3">
          <div className="sr-title">SUGAR RUSH</div>
          <div className="text-[10px] tracking-widest uppercase text-slate-400">Cluster 7×7 · Cascata · Mult. de posição</div>
          <div className="flex flex-wrap gap-2 justify-center">
            {inBonus && <span className="sr-badge bonus">FREE SPINS {freeSpins}</span>}
            {roundWin > 0 && <span className="sr-badge bonus">+{formatMoney(roundWin)}</span>}
            <span className="sr-badge">5+ cluster</span>
            <span className="sr-badge">⭐ = scatter</span>
          </div>
          <div className="sr-board">
            {Array.from({ length: SR_COLS }, (_, c) => (
              <div key={c} className={cn('sr-col', spinningCols[c] && 'is-spinning')}>
                {spinningCols[c] ? (
                  <div className="sr-strip" style={{ animationDelay: `${-c * 0.17}s` }}>
                    {[...SR_STRIP, ...SR_STRIP, ...SR_STRIP].map((sym, i) => (
                      <div key={i} className="sr-cell sr-cell-spin">{sym}</div>
                    ))}
                  </div>
                ) : (
                  Array.from({ length: SR_ROWS }, (_, r) => {
                    const key = c + ',' + r;
                    const m = marks[c] && marks[c][r] ? marks[c][r] : 0;
                    const fx = cellFx[key];
                    return (
                      <div key={key} className={cn('sr-cell sr-land', highlight.has(key) && 'is-hit', fx === 'fall' && 'is-fall', fx === 'drop' && 'is-drop')}>
                        {grid[c] && grid[c][r]}
                        {m > 1 && <span className="sr-mval">×{m}</span>}
                        {m === 1 && <span className="sr-mval" style={{ opacity: .5 }}>•</span>}
                      </div>
                    );
                  })
                )}
              </div>
            ))}
          </div>
          <div className={cn('sr-status', roundWin > 0 && 'wintext')}>{status}</div>
          <BetInput value={bet} onChange={setBet} disabled={busy} />
          <div className="flex flex-col gap-2 px-1">
            <button disabled={busy} onClick={() => play(false)} className="w-full play-btn font-black py-3 rounded-xl disabled:opacity-50">
              {busy ? 'GIRANDO…' : 'GIRAR'}
            </button>
            <button
              disabled={busy || (!(hackSettings && hackSettings.infiniteBalance) && balance < bet * 100)}
              onClick={() => play(true)}
              className="w-full py-2.5 rounded-xl font-bold text-sm border border-amber-500/40 bg-amber-500/10 text-amber-300 disabled:opacity-40"
            >
              COMPRAR BÔNUS (100× = {formatMoney(bet * 100)})
            </button>
          </div>
        </div>
      );
    };

    // ========== SPACEMAN — estilo Crash completo + cashout 50/100 ==========
    const GameSpaceman = () => {
      const { placeBet, settleBet, hackSettings, balance } = useAppState();
      const [bet, setBet] = useState(10);
      const [gameState, setGameState] = useState('idle');
      const [multiplier, setMultiplier] = useState(1);
      const [history, setHistory] = useState([2.14, 1.03, 5.6, 1.42, 3.1, 12.4, 1.18, 2.05, 1.01, 4.7]);
      const [halfDone, setHalfDone] = useState(false);
      const [halfLocked, setHalfLocked] = useState(0);
      const [remainingFrac, setRemainingFrac] = useState(1);
      const intervalRef = useRef(null);
      const betIdRef = useRef(null);
      const multRef = useRef(1);
      const crashRef = useRef(2);
      const remainingRef = useRef(1);
      const halfLockedRef = useRef(0);
      const settledRef = useRef(false);

      useEffect(() => () => clearInterval(intervalRef.current), []);

      const crashProgress = Math.min(1, Math.max(0, Math.log(Math.max(1, multiplier)) / Math.log(8)));
      const curvePoint = (t) => ({ x: 6 + t * 88, y: 86 - Math.pow(t, 1.18) * 72 });
      const planePoint = curvePoint(crashProgress);
      const trailDots = (() => {
        const n = Math.max(10, Math.min(28, Math.round(10 + crashProgress * 16)));
        return Array.from({ length: n }, (_, i) => {
          const t = crashProgress * (i / Math.max(1, n - 1));
          const p = curvePoint(t);
          const fade = i / Math.max(1, n - 1);
          return { left: p.x, top: p.y, o: (gameState === 'idle' ? 0.12 : 0.2) + fade * 0.7, s: 0.55 + fade * 0.7 };
        });
      })();
      const curvePath = (() => {
        const steps = Math.max(12, Math.round(22 * Math.max(crashProgress, 0.1)));
        return Array.from({ length: steps + 1 }, (_, i) => {
          const t = crashProgress * (i / steps);
          const p = curvePoint(t);
          return `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
        }).join(' ');
      })();
      const areaPath = curvePath ? `${curvePath} L ${planePoint.x.toFixed(2)} 100 L 6 100 Z` : 'M 6 86 L 6 100 Z';
      const stars = useMemo(() => Array.from({ length: 18 }, (_, i) => ({
        left: 8 + ((i * 37) % 84), top: 6 + ((i * 53) % 78), delay: (i % 7) * 0.35, size: 1.5 + (i % 3)
      })), []);

      const finalize = (finalMult, detail, winAmount) => {
        if (settledRef.current) return;
        settledRef.current = true;
        clearInterval(intervalRef.current);
        setMultiplier(finalMult);
        multRef.current = finalMult;
        setHistory(h => [Number(finalMult.toFixed(2)), ...h].slice(0, 10));
        settleBet(betIdRef.current, winAmount, detail);
      };

      const start = () => {
        const b = Math.max(1, Number(bet) || 1);
        if (!(hackSettings && hackSettings.infiniteBalance) && balance < b) return;
        const id = placeBet(b, 'Spaceman', `Aposta ${formatMoney(b)}`);
        if (!id) return;
        betIdRef.current = id;
        settledRef.current = false;
        setHalfDone(false);
        setHalfLocked(0);
        halfLockedRef.current = 0;
        remainingRef.current = 1;
        setRemainingFrac(1);
        setGameState('playing');
        setMultiplier(1);
        multRef.current = 1;
        sfx(hackSettings, 'button');

        let crash = Math.min(200, Math.max(1.0, 0.97 / Math.max(Math.random(), 0.004)));
        if (hackSettings.nextOutcome === 'win') crash = Math.max(crash, 6);
        if (hackSettings.nextOutcome === 'loss') crash = 1 + Math.random() * 0.35;
        crashRef.current = crash;
        const t0 = Date.now();
        intervalRef.current = setInterval(() => {
          const cur = Math.exp((Date.now() - t0) / 5500);
          if (cur >= crashRef.current) {
            clearInterval(intervalRef.current);
            setGameState('crashed');
            sfx(hackSettings, 'explosion');
            const secured = halfLockedRef.current;
            finalize(crashRef.current, secured > 0
              ? `Crash ${crashRef.current.toFixed(2)}x · parcial ${formatMoney(secured)}`
              : `Crash em ${crashRef.current.toFixed(2)}x`, secured);
            return;
          }
          multRef.current = cur;
          setMultiplier(cur);
        }, 50);
      };

      const cashFull = () => {
        if (gameState !== 'playing' || settledRef.current) return;
        clearInterval(intervalRef.current);
        const mult = multRef.current;
        const b = Math.max(1, Number(bet) || 1);
        const win = halfLockedRef.current + b * remainingRef.current * mult;
        setGameState('cashed');
        sfx(hackSettings, 'coin');
        finalize(mult, `Cash Out ${mult.toFixed(2)}x`, win);
      };

      const cashHalf = () => {
        if (gameState !== 'playing' || halfDone || remainingRef.current < 1) return;
        const mult = multRef.current;
        const b = Math.max(1, Number(bet) || 1);
        const locked = b * 0.5 * mult;
        halfLockedRef.current = locked;
        setHalfLocked(locked);
        setHalfDone(true);
        remainingRef.current = 0.5;
        setRemainingFrac(0.5);
        sfx(hackSettings, 'chip_place');
      };

      return (
        <div className="max-w-xl w-full mx-auto space-y-4 sm:space-y-5 px-0">
          <div className="flex gap-2 justify-center flex-wrap font-mono text-xs">
            {history.map((h, i) => (
              <span key={`${h}-${i}`} style={{ animationDelay: `${i * 0.04}s` }}
                className={cn('crash-hist-chip px-2.5 py-1 rounded-full border font-bold',
                  h >= 2 ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700/50' : 'bg-red-950/80 text-red-300 border-red-800/50')}>
                {Number(h).toFixed(2)}x
              </span>
            ))}
          </div>

    // ========== PENALTY SHOOTOUT — interface clara ==========
    const PS_MULTS = [1.92, 3.84, 7.68, 15.36, 30.72];
    const PS_SAVE_CHANCE = [0.18, 0.24, 0.30, 0.36, 0.42]; // chance de DEFESA por chute (sobe aos poucos)
    const PS_ZONES = ['ESQ.', 'MEIO-E', 'CENTRO', 'MEIO-D', 'DIR.'];

    const GamePenalty = () => {
      const { placeBet, settleBet, hackSettings, balance } = useAppState();
      const [bet, setBet] = useState(10);
      const [st, setSt] = useState('idle'); // idle | aiming | shooting | won | lost
      const [step, setStep] = useState(0);
      const [busy, setBusy] = useState(false);
      const [lastHit, setLastHit] = useState(null);
      const [keeperPos, setKeeperPos] = useState(2);
      const [ballPos, setBallPos] = useState(null); // {x,y,phase}
      const [banner, setBanner] = useState('');
      const idRef = useRef(null);
      const stepRef = useRef(0);
      stepRef.current = step;

      const currentMult = step > 0 ? PS_MULTS[step - 1] : 0;
      const nextMult = step < 5 ? PS_MULTS[step] : null;
      const potential = currentMult > 0 ? bet * currentMult : 0;

      const start = () => {
        const b = Math.max(1, Number(bet) || 1);
        if (!(hackSettings && hackSettings.infiniteBalance) && balance < b) return;
        const id = placeBet(b, 'Penalty Shootout', `Aposta ${formatMoney(b)}`);
        if (!id) return;
        idRef.current = id;
        setStep(0);
        stepRef.current = 0;
        setLastHit(null);
        setKeeperPos(2);
        setBallPos(null);
        setBanner('');
        setSt('aiming');
        sfx(hackSettings, 'button');
      };

      const shoot = (idx) => {
        if (st !== 'aiming' || busy || step >= 5) return;
        setBusy(true);
        setSt('shooting');
        const kick = stepRef.current;

        // ball flies toward chosen zone
        setBallPos({ zone: idx, phase: 'fly' });
        sfx(hackSettings, 'chip_place');

        // keeper dives (biased toward chosen zone)
        const dive = Math.random() < 0.5 ? idx : Math.floor(Math.random() * 5);
        setTimeout(() => setKeeperPos(dive), 180);

        let saved = Math.random() < PS_SAVE_CHANCE[kick];
        if (hackSettings.nextOutcome === 'win') saved = false;
        if (hackSettings.nextOutcome === 'loss') saved = true;

        setTimeout(() => {
          setBallPos({ zone: idx, phase: saved ? 'save' : 'goal' });
          if (saved) {
            setLastHit({ idx, result: 'save' });
            setBanner('DEFESA!');
            setSt('lost');
            sfx(hackSettings, 'loss');
            settleBet(idRef.current, 0, `Penalty — defesa no ${kick + 1}º chute`);
            setBusy(false);
            return;
          }
          const newStep = kick + 1;
          setStep(newStep);
          stepRef.current = newStep;
          setLastHit({ idx, result: 'goal' });
          setBanner('GOL!');
          sfx(hackSettings, 'win');
          if (newStep >= 5) {
            const mult = PS_MULTS[4];
            setSt('won');
            settleBet(idRef.current, bet * mult, `Penalty 5/5 · ${mult.toFixed(2)}x`);
            setBusy(false);
            setTimeout(() => setBanner(''), 1000);
          } else {
            setBusy(false);
            setTimeout(() => {
              setBanner('');
              setLastHit(null);
              setBallPos(null);
              setKeeperPos(2);
              setSt('aiming');
            }, 850);
          }
        }, 650);
      };

      const collect = () => {
        if (st !== 'aiming' || step <= 0 || busy) return;
        const mult = PS_MULTS[step - 1];
        setSt('won');
        setBanner('COLETOU');
        sfx(hackSettings, 'coin');
        settleBet(idRef.current, bet * mult, `Penalty coletou ${step}/5 · ${mult.toFixed(2)}x`);
      };

      return (
        <div className="ps-wrap max-w-lg w-full mx-auto space-y-3 sm:space-y-4">
          <div className="text-center space-y-1">
            <div className="text-3xl">⚽</div>
            <div className="font-black tracking-wide text-amber-400 text-lg">PENALTY SHOOTOUT</div>
            <div className="text-xs text-slate-400 leading-relaxed max-w-sm mx-auto">
              Você é o batedor. Clique em uma zona do gol para chutar.
              Cada gol aumenta o multiplicador. Uma defesa e você perde tudo da rodada.
            </div>
          </div>

          {/* Progresso dos 5 chutes */}
          <div className="ps-progress">
            {PS_MULTS.map((mv, i) => (
              <div key={i} className={cn('ps-step-card', step > i && 'done', st !== 'idle' && step === i && 'current', st === 'lost' && step === i && 'failed')}>
                <div className="ps-step-num">{step > i ? '✓' : (i + 1)}</div>
                <div className="ps-step-mult">{mv.toFixed(2)}x</div>
              </div>
            ))}
          </div>

          {/* Painel de status */}
          <div className="ps-info-bar">
            {st === 'idle' && <span>Aposte e inicie a cobrança</span>}
            {st === 'aiming' && step < 5 && (
              <span>
                Chute <b>{step + 1} de 5</b>
                {step > 0 && <> · agora <b className="text-amber-300">{formatMoney(potential)}</b> ({currentMult.toFixed(2)}x)</>}
                {nextMult && <> · se acertar: <b className="text-emerald-300">{nextMult.toFixed(2)}x</b></>}
                {' · '}risco de defesa <b className="text-red-300">{Math.round(PS_SAVE_CHANCE[step] * 100)}%</b>
              </span>
            )}
            {st === 'shooting' && <span className="text-amber-300">Chutando…</span>}
            {st === 'won' && <span className="text-emerald-300 font-black">Você levou {formatMoney(bet * (step > 0 ? PS_MULTS[step - 1] : 1))}!</span>}
            {st === 'lost' && <span className="text-red-300 font-black">Goleiro defendeu o {step + 1}º chute — perdeu a rodada</span>}
          </div>

          {/* GOL */}
          <div className="ps-goal">
            <div className="ps-post ps-post-l" />
            <div className="ps-post ps-post-r" />
            <div className="ps-post ps-post-t" />
            <div className="ps-net" />
            <div className="ps-targets">
              {PS_ZONES.map((label, i) => (
                <button
                  key={i}
                  type="button"
                  disabled={st !== 'aiming' || busy}
                  onClick={() => shoot(i)}
                  className={cn(
                    'ps-target',
                    lastHit && lastHit.idx === i && lastHit.result === 'goal' && 'is-goal',
                    lastHit && lastHit.idx === i && lastHit.result === 'save' && 'is-save',
                    st === 'aiming' && !busy && 'is-live'
                  )}
                >
                  <span className="ps-target-label">{label}</span>
                  {lastHit && lastHit.idx === i && (
                    <span className="ps-target-result">{lastHit.result === 'goal' ? '⚽ GOL' : '🧤 DEFESA'}</span>
                  )}
                </button>
              ))}
            </div>
            <div className="ps-keeper" style={{ left: `${10 + keeperPos * 20}%` }} title="Goleiro">🧤</div>
            {ballPos && (
              <div
                className={cn('ps-ball', ballPos.phase === 'fly' && 'is-fly', ballPos.phase === 'goal' && 'is-goal', ballPos.phase === 'save' && 'is-save')}
                style={{ left: `${10 + ballPos.zone * 20}%` }}
              >⚽</div>
            )}
            {banner && (
              <div className={cn('ps-banner', banner === 'GOL!' || banner === 'COLETOU' ? 'win' : 'loss')}>{banner}</div>
            )}
          </div>

          {/* Ações */}
          {st === 'aiming' && step > 0 && (
            <button onClick={collect} disabled={busy} className="w-full play-btn font-black py-3.5 rounded-xl disabled:opacity-40">
              COLETAR AGORA · {formatMoney(potential)}
            </button>
          )}
          {(st === 'idle' || st === 'won' || st === 'lost') && (
            <div className="space-y-3">
              <BetInput value={bet} onChange={setBet} />
              <button onClick={start} className="w-full play-btn font-black py-3.5 rounded-xl">
                {st === 'idle' ? 'INICIAR COBRANÇA' : 'NOVA RODADA'}
              </button>
            </div>
          )}
          {st === 'aiming' && step === 0 && (
            <p className="text-[11px] text-center text-slate-500">Toque em uma das 5 zonas do gol para chutar</p>
          )}
          {st === 'aiming' && step > 0 && step < 5 && (
            <p className="text-[11px] text-center text-slate-500">
              Continue chutando para subir o mult ou colete o prêmio atual.
            </p>
          )}
        </div>
      );
    };

                <button role="tab" aria-selected={marketTab === 'collectible'} onClick={() => setMarketTab('collectible')} className={`market-tab-btn rounded-lg px-4 py-3 text-sm font-black ${marketTab === 'collectible' ? 'active' : ''}`}>🌌 Colecionáveis <span className="opacity-70">(25)</span></button>

                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-3">

    const GamePinball = () => {
      const { placeBet, settleBet, balance, showNotification, hackSettings, diffs } = useAppState();
      const [bet, setBet] = useState(1); const [st, setSt] = useState('idle'); const [mult, setMult] = useState(0);
      const cv = useRef(null), G = useRef(null), K = useRef({ l: false, r: false }), raf = useRef(0);
      const D = { facil: { g: 0.16, b: 0.2, gap: 70 }, normal: { g: 0.2, b: 0.3, gap: 90 }, dificil: { g: 0.25, b: 0.45, gap: 115 } }[(diffs || {}).pinball || 'normal'];
      const W = 360, H = 520, BUMP = [[100, 140], [260, 140], [180, 220], [90, 300], [270, 300]];
      useEffect(() => {
        const kd = (e, v) => { if (['ArrowLeft', 'a', 'A'].includes(e.key)) K.current.l = v; if (['ArrowRight', 'd', 'D'].includes(e.key)) K.current.r = v; };
        const a = e => kd(e, true), b = e => kd(e, false);
        window.addEventListener('keydown', a); window.addEventListener('keyup', b);
        return () => { window.removeEventListener('keydown', a); window.removeEventListener('keyup', b); cancelAnimationFrame(raf.current); };
      }, []);
      const end = (win, txt) => { cancelAnimationFrame(raf.current); const g = G.current; if (!g || g.done) return; g.done = true; setSt('done'); settleBet(g.id, win, txt); };
      const start = () => {
        if (bet <= 0 || (!hackSettings.infiniteBalance && bet > balance)) { showNotification('Saldo fictício insuficiente!', 'error'); return; }
        const id = placeBet(bet, 'Pinball', 'Aposta: ' + formatMoney(bet)); if (!id) return;
        G.current = { id, bet, m: 0, done: false, x: 60 + Math.random() * 240, y: 30, vx: (Math.random() - 0.5) * 4, vy: 2, la: 0.45, ra: 0.45 };
        setMult(0); setSt('playing'); loop();
      };
      const cash = () => { const g = G.current; if (g && !g.done) end(g.bet * g.m, 'Saque em ' + g.m.toFixed(2) + 'x'); };
      const loop = () => {
        const g = G.current, c = cv.current; if (!g || !c || g.done) return;
        const x = c.getContext('2d'), R = 8, L = 70, py = 470;
        const lp = [W / 2 - D.gap / 2 - 63, py], rp = [W / 2 + D.gap / 2 + 63, py];
        g.la += ((K.current.l ? -0.5 : 0.45) - g.la) * 0.4; g.ra += ((K.current.r ? -0.5 : 0.45) - g.ra) * 0.4;
        g.vy += D.g; g.x += g.vx; g.y += g.vy;
        if (g.x < R) { g.x = R; g.vx = Math.abs(g.vx) * 0.9; } if (g.x > W - R) { g.x = W - R; g.vx = -Math.abs(g.vx) * 0.9; } if (g.y < R) { g.y = R; g.vy = Math.abs(g.vy) * 0.9; }
        BUMP.forEach(([bx, by]) => { const dx = g.x - bx, dy = g.y - by, d = Math.hypot(dx, dy); if (d < 22 + R) { const nx = dx / d, ny = dy / d; g.x = bx + nx * (22 + R); g.y = by + ny * (22 + R); g.vx = nx * 7; g.vy = ny * 7; g.m = Math.min(50, g.m + D.b); setMult(g.m); if (hackSettings.effectsEnabled) playSoundEffect('chip_place', hackSettings.sfxVolume); } });
        [[lp, g.la, 1, K.current.l], [rp, g.ra, -1, K.current.r]].forEach(([p, a, s, on]) => {
          const ex = p[0] + s * L * Math.cos(a), ey = p[1] + L * Math.sin(a), sx = ex - p[0], sy = ey - p[1];
          const u = Math.max(0, Math.min(1, ((g.x - p[0]) * sx + (g.y - p[1]) * sy) / (sx * sx + sy * sy)));
          const qx = p[0] + sx * u, qy = p[1] + sy * u, dx = g.x - qx, dy = g.y - qy, d = Math.hypot(dx, dy);
          if (d < R + 5) { const nx = dx / (d || 1), ny = dy / (d || 1); g.x = qx + nx * (R + 5); g.y = qy + ny * (R + 5); const vn = g.vx * nx + g.vy * ny; if (vn < 0) { g.vx -= 1.6 * vn * nx; g.vy -= 1.6 * vn * ny; } if (on) { g.vy -= 9; g.vx -= s * 2; } }
        });
        if (g.vy > 14) g.vy = 14; if (Math.abs(g.vx) > 10) g.vx = 10 * Math.sign(g.vx);
        x.fillStyle = '#020617'; x.fillRect(0, 0, W, H);
        BUMP.forEach(([bx, by]) => { x.fillStyle = '#6366f1'; x.beginPath(); x.arc(bx, by, 22, 0, 7); x.fill(); x.strokeStyle = '#a5b4fc'; x.lineWidth = 3; x.stroke(); });
        x.strokeStyle = '#fbbf24'; x.lineWidth = 9; x.lineCap = 'round';
        [[lp, g.la, 1], [rp, g.ra, -1]].forEach(([p, a, s]) => { x.beginPath(); x.moveTo(p[0], p[1]); x.lineTo(p[0] + s * L * Math.cos(a), p[1] + L * Math.sin(a)); x.stroke(); });
        x.fillStyle = '#f1f5f9'; x.beginPath(); x.arc(g.x, g.y, R, 0, 7); x.fill();
        if (g.m >= 50) { end(g.bet * g.m, 'Saque máximo 50x'); return; }
        if (g.y > H + 20) { end(0, 'Bola caiu no ralo (' + g.m.toFixed(2) + 'x perdido)'); return; }
        raf.current = requestAnimationFrame(loop);
      };

          <div className="flex justify-between font-mono"><span className="text-slate-400 text-sm">Multiplicador</span><span className="text-amber-400 font-black text-xl">{mult.toFixed(2)}x → {formatMoney(bet * mult)}</span></div>

          {st === 'playing' ? (<>

    }

    }

      transform: scale(.8)
    }

    .fav-star.pop-on {
      animation: favPop .65s cubic-bezier(.34, 1.56, .64, 1)
    }

    .fav-star.pop-off {
      animation: favOff .4s ease-out
    }

    .fav-ring {
      position: absolute;
      inset: 6px;
      border-radius: 9999px;
      border: 2px solid #f4d978;
      opacity: 0;
      pointer-events: none
    }

    .fav-ring.go {
      animation: favRing .6s ease-out
    }

      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      pointer-events: none
    }

    .fav-sparks i {
      position: absolute;
      left: -2.5px;
      top: -2.5px;
      width: 5px;
      height: 5px;
      border-radius: 9999px;
      background: #f4d978;
      box-shadow: 0 0 6px rgba(244, 217, 120, .9);
      opacity: 0;
      animation: favSpark .6s ease-out forwards

      height: 4px;
      animation-delay: .04s

      0% {
        transform: scale(1) rotate(0)
      }

      25% {
        transform: scale(.6) rotate(-25deg)
      }

      55% {
        transform: scale(1.45) rotate(18deg)
      }

      78% {
        transform: scale(.92) rotate(-6deg)
      }

      100% {
        transform: scale(1) rotate(0)
      }
    }

    @keyframes favOff {
      0% {
        transform: scale(1)
      }

      40% {
        transform: scale(.7) rotate(-12deg)
      }

      100% {
        transform: scale(1) rotate(0)
      }
    }

    @keyframes favRing {

      }

        transform: scale(1.9);
        opacity: 0
      }
    }

    @keyframes favSpark {

    }

        transform: translateY(0);
        opacity: 1

      }

      0% {
        transform: scale(.35);
        opacity: 0;
      }
      14% {
        transform: scale(1.12);
        opacity: 1;
      }
      24% {
        transform: scale(1);
        opacity: 1;
      }
      78% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(.96);
        opacity: 0;
      }
    }

        opacity: 1;
      }
      22% {

<style id="fix-corrections">
    /* Sidebar: hover suave sem crescer */
    aside button.sidebar-nav-item {
      transition: background-color .22s ease, color .22s ease, border-color .22s ease !important;
      transform: none !important;
    }
    aside button.sidebar-nav-item:not(:disabled):hover {
      transform: none !important;
      filter: none !important;
      background-color: rgba(201, 162, 39, .10) !important;
      color: #f4d978 !important;
    }
    aside button.sidebar-nav-item:not(:disabled):active {
      transform: none !important;
    }

    /* Jogos: padding-inline fixo de 5px — botões nunca encostam na borda */
    .game-surface {
      padding-inline: 5px !important;
      box-sizing: border-box;
    }
    :where(.game-surface > *) {
      max-width: 100%;
    }
    /* evita scale global dos botões empurrarem para fora da moldura */
    .game-surface button:not(:disabled):hover {
      transform: translateY(-1px) scale(1.02) !important;
    }

    /* Remove scroll desnecessário no site */
    html, body {
      overflow-x: hidden !important;
      max-width: 100vw !important;
    }
    body {
      overflow-y: auto;
    }
    main, #root, #root > div {
      max-width: 100%;
      overflow-x: hidden;
    }
    /* evita barra vertical fantasma em containers internos sem necessidade */
    .game-surface {
      overflow-x: hidden;
      overflow-y: visible;
    }
  </style>


<style id="solid-gold-relief">
  /* =========================================================
     OURO MACIÇO — só botões de AÇÃO (jogar/girar/sacar),

  /* ícones dos cards — nunca transparentes */

  .game-art-main,

  .game-card .text-5xl,
  .game-card .text-4xl,
  .game-card .text-3xl,
  .game-card span.game-icon {
    color: inherit !important;
    -webkit-text-fill-color: initial !important;
    background: none !important;
    background-image: none !important;
    -webkit-background-clip: border-box !important;
    background-clip: border-box !important;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .65)) drop-shadow(0 0 12px rgba(var(--c, 212, 175, 55), .3)) !important;

  .game-card > div.relative.h-32,

  /* títulos de marca (só aside / brand), sem tocar text-6xl dos cards */
  aside h1 {
    color: #f4d77a !important;
    -webkit-text-fill-color: #f4d77a !important;
    background: none !important;
    background-image: none !important;
    -webkit-background-clip: border-box !important;
    background-clip: border-box !important;
    text-shadow:
      0 1px 0 rgba(255, 241, 189, .55),
      0 -1px 0 rgba(90, 60, 5, .45),
      0 2px 8px rgba(201, 162, 39, .35) !important;

  }

  .ft-title, .goo-title, .sr-title {
    background: linear-gradient(180deg, #fff8df 0%, #f4d978 38%, #c9a227 72%, #8a6a1f 100%) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    color: transparent !important;
    -webkit-text-fill-color: transparent !important;

  /* Scrollbars ouro maciço */

  ::-webkit-scrollbar {

    box-shadow:

  .custom-scrollbar::-webkit-scrollbar-thumb {

  @media (prefers-reduced-motion: reduce) {

    .rou-spin-btn::after,
    .rou-new-round::after,
    .ft-spin::after,
    .goo-spin::after,
    .market-buy-btn::after,
    .market-entry-action::after,
    button.bg-emerald-500::after,
    button.bg-emerald-600::after,

<style id="game-felt-fix">
  /* =========================================================
     FUNDO DOS JOGOS — o verde da mesa (.game-surface) tem que aparecer.
     1) o painel preto que cobria a mesa inteira some (raiz de cada jogo);
     2) caixas internas (área do jogo, display, grade) ficam com um
        "fundinho" translúcido, mais claro e esverdeado — não preto;
     3) Mines e Keno: grade de quadrados limitada no PC.
     ========================================================= */

  /* 1) raiz do jogo: sem fundo/borda/sombra próprios */
  .game-surface > .bg-slate-900.rounded-2xl,
  .game-surface .bj-table {
    background: transparent !important;
    background-image: none !important;
    border-color: transparent !important;
    box-shadow: none !important;
  }

  /* 2) fundinho leve (substitui o preto das caixas internas) */
  .game-surface div.bg-slate-950.rounded-xl:not([class^="w-"]):not([class*=" w-"]):not([class*=":w-"]),
  .game-surface div.bg-slate-950.rounded-2xl:not([class^="w-"]):not([class*=" w-"]):not([class*=":w-"]),
  .game-surface div[class~="bg-slate-900/70"],
  .game-surface .game-fundinho:not([class*="bg-amber"]) {
    background: linear-gradient(145deg, rgba(30, 120, 86, .22), rgba(10, 58, 42, .30)) !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04) !important;
  }
  .game-surface .game-fundinho:not([class*="border-"]) {
    border: 1px solid rgba(212, 175, 55, .22);
  }

  /* 3) Mines / Keno: quadrados menores no desktop (no celular continua ocupando a largura) */
  .game-surface .mines-grid {
    width: 100%;
    max-width: 20rem;
    margin-left: auto;
    margin-right: auto;
  }
  .game-surface .keno-grid {
    width: 100%;
    max-width: 26rem;
    margin-left: auto;
    margin-right: auto;
  }

  /* tema claro */
  html[data-theme="light"] .game-surface div.bg-slate-950.rounded-xl:not([class^="w-"]):not([class*=" w-"]):not([class*=":w-"]),
  html[data-theme="light"] .game-surface div.bg-slate-950.rounded-2xl:not([class^="w-"]):not([class*=" w-"]):not([class*=":w-"]),
  html[data-theme="light"] .game-surface div[class~="bg-slate-900/70"],
  html[data-theme="light"] .game-surface .game-fundinho:not([class*="bg-amber"]) {
    background: rgba(255, 255, 255, .55) !important;
  }
</style>

<style id="game-size-fix">
  /* =========================================================
     TAMANHO DOS JOGOS — menos altura (PC e celular), sem esticar a mesa.
     (a largura voltou ao normal ao corrigir a regra ".game-surface > *")
     ========================================================= */

  /* cabeçalho da página do jogo mais compacto */
  .game-head { margin-bottom: .35rem; }
  .game-head button { white-space: nowrap; }
  .game-diff { margin-bottom: .5rem; gap: .35rem; }
  .game-diff > span:last-child { font-size: 11px; line-height: 1.25; }

  /* a mesa só tem a altura do próprio jogo */
  .game-surface { padding-top: 8px !important; padding-bottom: 8px !important; }
  .game-surface > [class~="p-6"], .game-surface > [class~="p-5"], .game-surface > [class~="p-4"],
  .game-surface > [class~="sm:p-6"], .game-surface > [class~="sm:p-5"],
  .game-surface .bj-table {
    padding: 12px !important;
  }
  .game-surface [class*="space-y-4"] > :not([hidden]) ~ :not([hidden]),
  .game-surface [class*="space-y-5"] > :not([hidden]) ~ :not([hidden]) { margin-top: .65rem !important; }
  .game-surface [class*="space-y-6"] > :not([hidden]) ~ :not([hidden]) { margin-top: .75rem !important; }
  .game-surface [class*="space-y-8"] > :not([hidden]) ~ :not([hidden]) { margin-top: 1rem !important; }
  .game-surface > [class*="space-y-"] { }

  /* áreas de display com altura fixa: mais baixas */
  .game-surface .h-72 { height: 14rem !important; }
  .game-surface .h-60 { height: 11rem !important; }
  .game-surface .h-56 { height: 10.5rem !important; }
  .game-surface .h-52 { height: 9.5rem !important; }
  .game-surface div.h-40 { height: 7.5rem !important; }
  .game-surface div.h-36 { height: 6.5rem !important; }
  .game-surface div.h-28 { height: 6rem !important; }
  .game-surface .min-h-64 { min-height: 11rem !important; }

  /* caixas internas com padding grande */
  .game-surface div.rounded-xl[class~="p-6"], .game-surface div.rounded-xl[class~="p-5"],
  .game-surface div.rounded-2xl[class~="p-5"], .game-surface div.rounded-2xl[class~="p-4"] {
    padding: .75rem !important;
  }

  /* Safe Cracker: slots e botões de símbolo menores */
  .game-surface div[class*="w-14"][class*="h-16"] { width: 3rem !important; height: 3.25rem !important; font-size: 1.6rem !important; }
  .game-surface button[class*="w-14"][class*="h-14"] { width: 2.9rem !important; height: 2.9rem !important; font-size: 1.5rem !important; }

  /* Fortune (todos): células e cabeçalho menores */
  .ft-wrap { --ftc: 50px !important; }
  .ft-wrap:has(.ft-reel[style*="* 5"]) { --ftc: 42px !important; }
  .ft-wrap .ft-tiger-wrap { height: 50px !important; }
  .ft-wrap .ft-tiger { font-size: 40px !important; line-height: 50px !important; }
  @media (max-width: 420px) {
    .ft-wrap { --ftc: 46px !important; }
    .ft-wrap:has(.ft-reel[style*="* 5"]) { --ftc: 40px !important; }
  }

  /* Sugar Rush / Olympus: tabuleiros 7x7 / 6x5 são grandes por natureza -> escala no PC */
  @media (min-width: 640px) {
    .game-surface .sr-wrap, .game-surface .goo-wrap { zoom: .88; }
  }

  /* cabeçalho da página do jogo: voltar + título + "Como Jogar" na mesma linha */
  .game-head > div:first-child { flex-wrap: nowrap !important; gap: .6rem !important; flex: 1 1 0; min-width: 0; }
  .game-head > div:first-child > button { font-size: .85rem; white-space: nowrap; flex: none; }
  .game-head h2 { font-size: 1.05rem !important; line-height: 1.15; min-width: 0; white-space: normal; }
  /* botão principal ao lado dos campos de aposta: nunca quebra o texto em 2 linhas */
  .game-surface button.flex-1[class~="px-6"] { min-width: 8.5rem; white-space: nowrap; }
  .game-head > button { flex: none; padding: .35rem .6rem; }
</style>

</body>
