    .die-face {
      position: relative;
      border-radius: 14%;
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, .55),
        inset 0 -3px 6px rgba(0, 0, 0, .18),
        0 6px 14px rgba(0, 0, 0, .35);
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      contain: layout style;
    }

    .die-face.ivory {
      background: linear-gradient(145deg, #fffef8 0%, #f0e6c8 55%, #e4d4a8 100%);
      border: 1px solid #c9b87a;
    }

    .die-face.blue {
      background: linear-gradient(145deg, #5b8def 0%, #2563eb 55%, #1d4ed8 100%);
      border: 1px solid #1e40af;
    }

    .die-face.red {
      background: linear-gradient(145deg, #f87171 0%, #dc2626 55%, #b91c1c 100%);
      border: 1px solid #991b1b;
    }

    .die-face .pip {
      position: absolute;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35);
    }

    .die-face.ivory .pip {
      background: radial-gradient(circle at 35% 30%, #4a3f2e, #1a1208);
    }

    .die-face.blue .pip,
    .die-face.red .pip {
      background: radial-gradient(circle at 35% 30%, #fff, #e8e8e8);
    }

    .die-face.rolling {
      animation: diceThrow 1.2s cubic-bezier(.22, .61, .36, 1) both;
      will-change: transform;
      box-shadow: 0 8px 16px rgba(0, 0, 0, .28);
    }

    .die-face.rolling-delay {
      animation-delay: 0.1s;
    }

    @keyframes diceThrow {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }

      15% {
        transform: translate(-8px, -42px) rotate(-90deg) scale(1.08);
      }

      30% {
        transform: translate(12px, -70px) rotate(180deg) scale(1.12);
      }

      45% {
        transform: translate(-10px, -55px) rotate(300deg) scale(1.06);
      }

      60% {
        transform: translate(6px, -18px) rotate(400deg) scale(0.98);
      }

      75% {
        transform: translate(-3px, 4px) rotate(480deg) scale(0.94);
      }

      88% {
        transform: translate(2px, -6px) rotate(530deg) scale(1.02);
      }

      100% {
        transform: translate(0, 0) rotate(540deg) scale(1);
      }
    }

    .die-face.land {
      animation: diceLand 0.45s cubic-bezier(.2, .85, .3, 1) both;
    }

    @keyframes diceLand {
      0% {
        transform: scale(1.08) rotate(-4deg);
      }

      40% {
        transform: scale(0.96) rotate(2deg);
      }

      70% {
        transform: scale(1.02) rotate(-1deg);
      }

      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    .die-face.numeric {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #1a1208;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
    }

    .die-face.numeric.blue,
    .die-face.numeric.red {
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }

    .die-face .die-label {
      position: absolute;
      bottom: 4%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0.55;
      text-transform: uppercase;
    }

    .dice-roll {
      animation: roll 0.4s ease-in-out;
    }

    @keyframes roll {
      0% {
        transform: rotate(0deg) scale(1);
      }

      50% {
        transform: rotate(180deg) scale(1.1);
      }

      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    .glow-green {
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    .glow-red {
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    .slot-spin {
      animation: spinReel 0.1s linear infinite;
    }

    @keyframes spinReel {
      0% {
        transform: translateY(-50%);
      }

      100% {
        transform: translateY(50%);
      }
    }

    .plinko-ball {
      transition: none;
      will-change: left, top;

    /* === Animações dos jogos === */
    .coin-stage {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      perspective: 1100px;
      perspective-origin: 50% 40%;
      position: relative;
    }

    .coin-shadow {
      position: absolute;
      bottom: 18px;
      left: 50%;
      width: 72px;
      height: 14px;
      margin-left: -36px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 0, 0, .55) 0%, transparent 70%);
      filter: blur(2px);
      pointer-events: none;
      z-index: 0;
      transition: none;
    }

    .coin-shadow.is-flip {
      animation: coinShadowReal 1.7s linear forwards;
    }

    @keyframes coinShadowReal {
      0% {
        transform: scale(1);
        opacity: .55;
      }

      10% {
        transform: scale(.72);
        opacity: .4;
      }

      25% {
        transform: scale(.48);
        opacity: .25;
      }

      40% {
        transform: scale(.34);
        opacity: .16;
      }

      50% {
        transform: scale(.32);
        opacity: .14;
      }

      65% {
        transform: scale(.42);
        opacity: .22;
      }

      80% {
        transform: scale(.7);
        opacity: .38;
      }

      90% {
        transform: scale(1.12);
        opacity: .5;
      }

      95% {
        transform: scale(.95);
        opacity: .52;
      }

      100% {
        transform: scale(1);
        opacity: .55;
      }
    }

      content: "";

    /* Bloco com espessura: camadas empilhadas (mesma técnica da moeda) aparecem de lado durante o giro */
    .mine-inner.is-flipped {

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      inset: 0;
      border-radius: inherit;
      background: #fff;

    .slot-machine-reel {
      position: relative;

    .slot-machine-reel::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 24%;
      z-index: 2;
      pointer-events: none;
    }

    .slot-machine-reel::before {
      top: 0;
      background: linear-gradient(#0b0d0c, transparent);
      opacity: .28;
    }

    .slot-machine-reel::after {
      bottom: 0;
      background: linear-gradient(transparent, #0b0d0c);

    @keyframes slotReelSpinReal {
      0% {
        transform: translateY(-92px) rotateX(18deg) scale(.86);
        filter: blur(5px);
        opacity: .55;
      }

      48% {
        transform: translateY(0) rotateX(0) scale(1);
        filter: blur(1.5px);
        opacity: 1;
      }

      100% {
        transform: translateY(92px) rotateX(-18deg) scale(.86);
        filter: blur(5px);
        opacity: .55;

    .crash-stage {
      position: relative;
      isolation: isolate;
      border-radius: 16px;
      background:
        radial-gradient(ellipse 90% 55% at 50% 115%, rgba(201, 162, 39, .16), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 10%, rgba(56, 100, 180, .14), transparent 50%),
        radial-gradient(ellipse 60% 40% at 15% 20%, rgba(120, 60, 160, .1), transparent 55%),
        linear-gradient(165deg, #050a14 0%, #0a1424 38%, #0c1018 72%, #0a0c10 100%);
      box-shadow:
        inset 0 0 60px rgba(0, 0, 0, .55),
        inset 0 1px 0 rgba(255, 255, 255, .04),
        0 0 0 1px rgba(212, 175, 55, .14),
        0 12px 28px rgba(0, 0, 0, .35);
      overflow: hidden;
    }

    .crash-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse 100% 40% at 50% 100%, rgba(201, 162, 39, .12), transparent 60%),
        linear-gradient(180deg, rgba(5, 10, 20, .15) 0%, transparent 35%, transparent 70%, rgba(0, 0, 0, .35) 100%);
    }

    .crash-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, .5);
      border-radius: inherit;
    }

    .crash-sky {

      inset: 0;

      z-index: 0;
      background:
        radial-gradient(circle at 72% 18%, rgba(90, 140, 220, .12) 0%, transparent 28%),
        radial-gradient(circle at 20% 35%, rgba(160, 90, 200, .08) 0%, transparent 32%);
      animation: crashSkyPulse 7s ease-in-out infinite alternate;

    .crash-horizon {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -8%;
      height: 42%;
      pointer-events: none;
      z-index: 0;
      background:

    .crash-stage.crashed {

    .crash-stage.crashed .crash-horizon {

        radial-gradient(ellipse 80% 70% at 50% 100%, rgba(248, 113, 113, .28) 0%, rgba(120, 20, 30, .12) 40%, transparent 72%);

    .crash-stage.cashed {

      font-variant-numeric: tabular-nums;
      pointer-events: none;
      transition: color .3s ease, text-shadow .3s ease, transform .2s ease;
    }

    .crash-multiplier.is-live {
      animation: crashMultiPulse 1.1s ease-in-out infinite;
    }

    .crash-multiplier.crashed {
      color: #f87171;
      text-shadow: 0 4px 18px rgba(0, 0, 0, .75), 0 0 28px rgba(248, 113, 113, .4);
      animation: crashMultiPop .45s cubic-bezier(.2, 1.2, .3, 1) both;
    }

    .crash-multiplier.cashed {
      color: #34d399;
      text-shadow: 0 4px 18px rgba(0, 0, 0, .75), 0 0 28px rgba(52, 211, 153, .4);
      animation: crashMultiPop .45s cubic-bezier(.2, 1.2, .3, 1) both;
    }

    @keyframes crashMultiPulse {

      0%,
      100% {
        transform: scale(1);
        filter: brightness(1);
      }

      50% {
        transform: scale(1.03);
        filter: brightness(1.12);
      }
    }

    @keyframes crashMultiPop {
      0% {
        transform: scale(.85);
        opacity: .6;
      }

      55% {
        transform: scale(1.12);
        opacity: 1;
      }

      100% {
        transform: scale(1);
      }
    }

    .crash-status {
      position: absolute;
      left: 5%;
      top: calc(5% + 3.8rem);
      z-index: 5;
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
      pointer-events: none;
      color: #a99f8c;
      animation: crashStatusIn .4s ease-out both;
    }

    .crash-status.crashed {
      color: #f87171;
    }

    .crash-status.cashed {
      color: #34d399;
    }

    .crash-status.idle {
      color: #8b8474;
      letter-spacing: .16em;
    }

    @keyframes crashStatusIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .crash-trail-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: #f1d77a;
      box-shadow: 0 0 8px rgba(241, 215, 122, .65);
      pointer-events: none;
      z-index: 3;
    }

    .crash-grid-layer {
      position: absolute;
      inset: 0;
      opacity: .12;
      pointer-events: none;
      z-index: 1;
      background-image:
        linear-gradient(rgba(140, 165, 190, .18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 165, 190, .18) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 75%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 75%, transparent 100%);
      animation: crashGridDrift 22s linear infinite;
    }

    .crash-stage.playing .crash-grid-layer {
      opacity: .18;
    }

    @keyframes crashGridDrift {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 34px -34px;
      }
    }

    .crash-explosion {
      animation: crashExplosion .65s cubic-bezier(.2, .9, .25, 1) both !important;
      transition: none !important;
    }

    @keyframes crashExplosion {
      0% {
        transform: translate3d(-50%, -50%, 0) scale(.2);
        opacity: 0;
        filter: brightness(2);
      }

      40% {
        transform: translate3d(-50%, -50%, 0) scale(1.45);
        opacity: 1;
        filter: brightness(1.4);
      }

      70% {
        transform: translate3d(-50%, -50%, 0) scale(1.1);
        opacity: 1;
      }

      100% {
        transform: translate3d(-50%, -50%, 0) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
    }

    .crash-boom-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-radius: 50%;
      border: 2px solid rgba(248, 113, 113, .85);
      pointer-events: none;
      z-index: 6;
      animation: crashBoomRing .7s ease-out forwards;
    }

    @keyframes crashBoomRing {
      0% {
        transform: scale(.4);
        opacity: 1;
      }

      100% {
        transform: scale(6);
        opacity: 0;
      }
    }

    .crash-cash-btn {
      animation: crashCashGlow 1.4s ease-in-out infinite;
    }

    @keyframes crashCashGlow {

      0%,
      100% {
        box-shadow: 0 0 18px rgba(245, 158, 11, .22);
      }

      50% {
        box-shadow: 0 0 32px rgba(245, 158, 11, .42), 0 0 0 2px rgba(251, 191, 36, .2);
      }
    }

    .crash-hist-chip {
      animation: crashHistIn .35s cubic-bezier(.2, .9, .25, 1) both;
    }

    @keyframes crashHistIn {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(.9);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .crash-stage.crashed,
      .crash-stage.cashed,
      .crash-plane.is-flying .crash-plane-icon,
      .crash-plane.is-flying .crash-flame,
      .crash-multiplier.is-live,
      .crash-multiplier.crashed,
      .crash-multiplier.cashed,
      .crash-grid-layer,
      .crash-star,
      .crash-cash-btn,
      .crash-explosion,
      .crash-boom-ring {
        animation: none !important;
      }
    }

    /* GPU-friendly defaults for animated UI */
    .anim-pop,
    .anim-win,
    .anim-loss,
    .anim-bounce,
    .chip-badge-bounce,
    .coin-3d,
    .slot-symbol,
    .bet-card {
      transform: translateZ(0);

    }

    }

    @keyframes crashExplosion {

        opacity: 0
      }

      55% {
        transform: scale(1.18);
        opacity: 1
      }

        opacity: 1
      }
    }

    .safe-active-pulse {

    }

    @keyframes safeSymbolPop {

        opacity: .25;

      }

      60% {
        opacity: 1;
        transform: scale(1.12) translateY(-2px)
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0)
      }
    }

    @keyframes safeChoicePop {
      0% {
        transform: scale(.94)
      }

      55% {
        transform: scale(1.08)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes safeFeedbackIn {
      0% {
        opacity: 0;
        transform: translateY(-8px) scale(.94)
      }

      65% {
        opacity: 1;
        transform: translateY(2px) scale(1.02)
      }

      100% {
        opacity: 1;
        transform: none
      }
    }

    @keyframes safeActivePulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(251, 191, 36, .08)

    .bet-card.card-back {

    @keyframes cardDealIn {

      .sidebar-hidden {

      }

    .sidebar-smooth {

    /* === ANIMAÇÕES OBRIGATÓRIAS: GANHO E PERDA === */
    @keyframes winPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }

      40% {
        transform: scale(1.08);
        box-shadow: 0 0 30px 8px rgba(16, 185, 129, 0.5);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    @keyframes lossShake {

      0%,
      100% {
        transform: translateX(0);
      }

      15% {
        transform: translateX(-8px) rotate(-1deg);
      }

      30% {
        transform: translateX(8px) rotate(1deg);
      }

      45% {
        transform: translateX(-6px);
      }

      60% {
        transform: translateX(6px);
      }

      75% {
        transform: translateX(-3px);
      }

      90% {
        transform: translateX(3px);
      }
    }

    @keyframes winFlash {
      0% {
        background: rgba(16, 185, 129, 0);
      }

      30% {
        background: rgba(16, 185, 129, 0.25);
      }

      100% {
        background: rgba(16, 185, 129, 0);
      }
    }

    @keyframes lossFlash {
      0% {
        background: rgba(239, 68, 68, 0);
      }

      30% {
        background: rgba(239, 68, 68, 0.3);
      }

      100% {
        background: rgba(239, 68, 68, 0);
      }
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      60% {
        transform: scale(1.15);
        opacity: 1;
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0.2) translateY(30px);
        opacity: 0;
      }

      55% {
        transform: scale(1.12) translateY(-6px);
        opacity: 1;
      }

      75% {
        transform: scale(0.96) translateY(2px);
      }

      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .anim-win {
      animation: winPulse 0.8s ease-out;
    }

    .anim-loss {
      animation: lossShake 0.6s ease-in-out;
    }

    .anim-win-flash {
      animation: winFlash 0.7s ease-out;
    }

    .anim-loss-flash {
      animation: lossFlash 0.7s ease-out;
    }

    .anim-pop {
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .anim-bounce {
      animation: bounceIn 0.5s ease-out;
    }

    /* Botões: hover + active em tudo */
    button {
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px) scale(1.03);
      filter: brightness(1.1);
    }

    button:not(:disabled):active {
      transform: translateY(1px) scale(0.96);
      filter: brightness(0.95);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    /* Overlay global de resultado */

      pointer-events: none;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      animation: resultOverlayIn .25s ease-out both;
    }

    @keyframes resultOverlayIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .result-overlay .banner {
      pointer-events: none;
      position: relative;
      z-index: 2;
      padding: 1.75rem 2.75rem;
      border-radius: 1.35rem;

      font-size: clamp(1.75rem, 5.5vw, 2.75rem);
      letter-spacing: .02em;
      text-align: center;
      min-width: min(320px, 88vw);
      max-width: 92vw;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, .55),
        0 0 40px rgba(0, 0, 0, .25),
        inset 0 1px 0 rgba(255, 255, 255, .18);
      animation: bounceIn 0.55s cubic-bezier(.2, 1.15, .3, 1) both;
      text-shadow: 0 3px 10px rgba(0, 0, 0, .35);
    }

    .result-overlay .banner .result-sub {
      font-size: clamp(.95rem, 2.8vw, 1.2rem);
      font-weight: 800;
      margin-top: .55rem;
      opacity: .95;
      letter-spacing: .01em;
    }

    .result-overlay .banner .result-amount {
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      margin-top: .35rem;
      letter-spacing: -.02em;
    }

    .result-overlay.win .banner {
      background: linear-gradient(145deg, #0a6b4a 0%, #059669 45%, #10b981 100%);
      border: 3px solid #6ee7b7;
      color: #ecfdf5;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, .55),
        0 0 50px rgba(16, 185, 129, .35),
        inset 0 1px 0 rgba(255, 255, 255, .2);

    .result-overlay.loss .banner {
      background: linear-gradient(145deg, #7f1d1d 0%, #dc2626 50%, #ef4444 100%);
      border: 3px solid #fca5a5;
      color: #fef2f2;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, .55),
        0 0 50px rgba(239, 68, 68, .3),
        inset 0 1px 0 rgba(255, 255, 255, .15);
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      z-index: 1;
      animation: confettiFall 2.4s linear forwards;
      box-shadow: 0 0 6px rgba(255, 255, 255, .25);
    }

    /* force big banner even on mobile overrides later */
    .result-overlay .banner.result-banner-big {
      padding: 1.75rem 2.5rem !important;
      font-size: clamp(1.75rem, 5.5vw, 2.75rem) !important;
      max-width: 92vw !important;
    }

    /* Marcador de roleta / roda */
    .wheel-marker {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 18px solid #fbbf24;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.6));
      z-index: 20;
    }

    .wheel-marker::after {
      content: '';

      top: 16px;
      left: -4px;

      height: 8px;
      background: #fbbf24;
      border-radius: 50%;

    /* =========================================================
       LUXURY / POWER THEME — OBSIDIAN + GOLD + BURGUNDY
       ========================================================= */
    :root {
      --lux-bg: #080706;
      --lux-surface: #11100e;
      --lux-surface-2: #181613;
      --lux-surface-3: #211e18;
      --lux-border: #3a3020;
      --lux-gold: #d4af37;
      --lux-gold-bright: #f1d77a;
      --lux-champagne: #f7edc8;
      --lux-muted: #a99f8c;
      --lux-burgundy: #641322;
      --lux-burgundy-bright: #8e2034;
      --lux-green: #0d3a29;
    }

    html,
    body {
      background:
        radial-gradient(circle at 75% -10%, rgba(212, 175, 55, .12), transparent 34%),
        radial-gradient(circle at 10% 30%, rgba(100, 19, 34, .10), transparent 28%),
        var(--lux-bg) !important;
      color: var(--lux-champagne) !important;
    }

    body {
      background-image:
        linear-gradient(rgba(255, 255, 255, .012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .012) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, .06), transparent 42%) !important;
      background-size: 32px 32px, 32px 32px, 100% 100%;
    }

    /* Main dark surfaces */
    .bg-slate-950 {
      background-color: var(--lux-bg) !important;
    }

    .bg-slate-900 {
      background-color: var(--lux-surface) !important;
    }

    .bg-slate-800 {
      background-color: var(--lux-surface-2) !important;
    }

    .bg-slate-850 {
      background-color: #15130f !important;
    }

    .border-slate-800,
    .border-slate-700 {
      border-color: var(--lux-border) !important;
    }

    .text-slate-200,
    .text-slate-300,
    .text-slate-400 {
      color: var(--lux-champagne) !important;
    }

    .text-slate-500,
    .text-slate-600 {
      color: var(--lux-muted) !important;
    }

    .text-white {
      color: #fff8e7 !important;
    }

    /* Gold replaces the old neon-green/blue identity */
    .text-emerald-400,
    .text-emerald-500,
    .text-cyan-400,
    .text-sky-400,
    .text-indigo-400,
    .text-amber-400 {
      color: var(--lux-gold-bright) !important;
    }

    .bg-emerald-500,
    .bg-emerald-600,
    .bg-indigo-500,
    .bg-indigo-600,
    .bg-cyan-500 {
      background: linear-gradient(135deg, #8b6a1d, #d4af37 52%, #a77d1c) !important;
      color: #100d07 !important;
    }

    .border-emerald-500,
    .border-emerald-400,
    .border-amber-500,
    .border-amber-400,
    .border-indigo-400,
    .border-cyan-500 {
      border-color: var(--lux-gold) !important;
    }

    .bg-amber-500\/10 {
      background-color: rgba(212, 175, 55, .09) !important;
    }

    .border-amber-500\/30 {
      border-color: rgba(212, 175, 55, .38) !important;
    }

    /* Luxury cards */
    [class*="rounded-xl"],
    [class*="rounded-2xl"],

      --tw-ring-color: rgba(212, 175, 55, .16);
    }

    .shadow-2xl {

    }

    /* Header / navigation */
    header {
      background:
        linear-gradient(180deg, rgba(30, 27, 21, .98), rgba(12, 11, 9, .98)) !important;
      border-bottom: 1px solid #4a3b20 !important;

    }

    aside {
      background:
        linear-gradient(180deg, #12100d 0%, #090807 100%) !important;

    }

    aside h1 {

    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

    // --- SINTETIZADOR DE ÁUDIO WEB EXPANDIDO ---
    const playSoundEffect = (type, volume = 80) => {
      try {
        if (volume <= 0) return;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const volRatio = volume / 100;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'button' || type === 'confirm') {
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.setValueAtTime(600, now + 0.03);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'chip_select') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'chip_place') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
          gain.gain.setValueAtTime(0.15 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'roulette_spin') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
          gain.gain.setValueAtTime(0.08 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'ball_stop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.setValueAtTime(1400, now + 0.04);
          gain.gain.setValueAtTime(0.2 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'win') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.2 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'blackjack') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          osc.frequency.setValueAtTime(1046.50, now + 0.24);
          gain.gain.setValueAtTime(0.25 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
          osc.start(now); osc.stop(now + 0.6);
        } else if (type === 'loss' || type === 'bust') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
          gain.gain.setValueAtTime(0.2 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        } else if (type === 'tie') {
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.15 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'card' || type === 'hit') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
          gain.gain.setValueAtTime(0.12 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
          osc.start(now); osc.stop(now + 0.04);
        } else if (type === 'flip') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(600, now + 0.06);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
          osc.start(now); osc.stop(now + 0.06);
        } else if (type === 'dice') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'slots') {
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.setValueAtTime(1200, now + 0.05);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'explosion') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
          gain.gain.setValueAtTime(0.3 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'coin') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.setValueAtTime(1600, now + 0.1);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        }
      } catch (e) { console.log('Audio Context error or user interaction required'); }
    };

    const DIE_PIPS = {

    const DieFace = React.memo(({ value = 1, rolling = false, size = 56, color = 'ivory', delay = false }) => {
      const [display, setDisplay] = useState(value);

      const prevRolling = useRef(false);
      useEffect(() => {
        if (rolling) {
          prevRolling.current = true;

          const iv = setInterval(() => setDisplay(1 + Math.floor(Math.random() * 6)), 140);
          return () => clearInterval(iv);
        }

      }, [rolling, value]);
