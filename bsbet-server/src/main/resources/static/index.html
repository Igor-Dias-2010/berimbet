<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070605">
  <title>bsBET</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: { 850: '#151e2e', 950: '#090d16' },
            hack: { 400: '#f1d77a', 500: '#d4af37', 900: '#3b2a08' }
          }
        }
      }
    }
  </script>
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .die-face {
      position: relative;
      border-radius: 14%;
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, .55),
        inset 0 -3px 6px rgba(0, 0, 0, .18),
        0 6px 14px rgba(0, 0, 0, .35);
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      contain: layout style;
    }

    .die-face.ivory {
      background: linear-gradient(145deg, #fffef8 0%, #f0e6c8 55%, #e4d4a8 100%);
      border: 1px solid #c9b87a;
    }

    .die-face.blue {
      background: linear-gradient(145deg, #5b8def 0%, #2563eb 55%, #1d4ed8 100%);
      border: 1px solid #1e40af;
    }

    .die-face.red {
      background: linear-gradient(145deg, #f87171 0%, #dc2626 55%, #b91c1c 100%);
      border: 1px solid #991b1b;
    }

    .die-face .pip {
      position: absolute;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35);
    }

    .die-face.ivory .pip {
      background: radial-gradient(circle at 35% 30%, #4a3f2e, #1a1208);
    }

    .die-face.blue .pip,
    .die-face.red .pip {
      background: radial-gradient(circle at 35% 30%, #fff, #e8e8e8);
    }

    .die-face.rolling {
      animation: diceThrow 1.2s cubic-bezier(.22, .61, .36, 1) both;
      will-change: transform;
      box-shadow: 0 8px 16px rgba(0, 0, 0, .28);
    }

    .die-face.rolling-delay {
      animation-delay: 0.1s;
    }

    @keyframes diceThrow {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }

      15% {
        transform: translate(-8px, -42px) rotate(-90deg) scale(1.08);
      }

      30% {
        transform: translate(12px, -70px) rotate(180deg) scale(1.12);
      }

      45% {
        transform: translate(-10px, -55px) rotate(300deg) scale(1.06);
      }

      60% {
        transform: translate(6px, -18px) rotate(400deg) scale(0.98);
      }

      75% {
        transform: translate(-3px, 4px) rotate(480deg) scale(0.94);
      }

      88% {
        transform: translate(2px, -6px) rotate(530deg) scale(1.02);
      }

      100% {
        transform: translate(0, 0) rotate(540deg) scale(1);
      }
    }

    .die-face.land {
      animation: diceLand 0.45s cubic-bezier(.2, .85, .3, 1) both;
    }

    @keyframes diceLand {
      0% {
        transform: scale(1.08) rotate(-4deg);
      }

      40% {
        transform: scale(0.96) rotate(2deg);
      }

      70% {
        transform: scale(1.02) rotate(-1deg);
      }

      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    .die-face.numeric {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #1a1208;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
    }

    .die-face.numeric.blue,
    .die-face.numeric.red {
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }

    .die-face .die-label {
      position: absolute;
      bottom: 4%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0.55;
      text-transform: uppercase;
    }

    .dice-roll {
      animation: roll 0.4s ease-in-out;
    }

    @keyframes roll {
      0% {
        transform: rotate(0deg) scale(1);
      }

      50% {
        transform: rotate(180deg) scale(1.1);
      }

      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    .glow-green {
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    .glow-red {
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    .slot-spin {
      animation: spinReel 0.1s linear infinite;
    }

    @keyframes spinReel {
      0% {
        transform: translateY(-50%);
      }

      100% {
        transform: translateY(50%);
      }
    }

    .plinko-ball {
      transition: none;
      will-change: left, top;
    }

    /* === Animações dos jogos === */
    .coin-stage {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      perspective: 1100px;
      perspective-origin: 50% 40%;
      position: relative;
    }

    .coin-shadow {
      position: absolute;
      bottom: 18px;
      left: 50%;
      width: 72px;
      height: 14px;
      margin-left: -36px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 0, 0, .55) 0%, transparent 70%);
      filter: blur(2px);
      pointer-events: none;
      z-index: 0;
      transition: none;
    }

    .coin-shadow.is-flip {
      animation: coinShadowReal 1.7s linear forwards;
    }

    @keyframes coinShadowReal {
      0% {
        transform: scale(1);
        opacity: .55;
      }

      10% {
        transform: scale(.72);
        opacity: .4;
      }

      25% {
        transform: scale(.48);
        opacity: .25;
      }

      40% {
        transform: scale(.34);
        opacity: .16;
      }

      50% {
        transform: scale(.32);
        opacity: .14;
      }

      65% {
        transform: scale(.42);
        opacity: .22;
      }

      80% {
        transform: scale(.7);
        opacity: .38;
      }

      90% {
        transform: scale(1.12);
        opacity: .5;
      }

      95% {
        transform: scale(.95);
        opacity: .52;
      }

      100% {
        transform: scale(1);
        opacity: .55;
      }
    }

    .coin-3d {
      width: 100px;
      height: 100px;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
      z-index: 1;
      margin-bottom: 28px;
    }

    .coin-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      border: 3px solid #7a5f18;
    }

    .coin-face.front {
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .55) 0%, transparent 35%),
        radial-gradient(circle at 70% 75%, rgba(0, 0, 0, .25) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #fff1bd 0%, #f0d477 28%, #c9a227 58%, #8a6a1f 100%);
      color: #3b2a08;
      transform: translateZ(5px);
      box-shadow:
        inset 0 0 0 4px rgba(255, 241, 189, .28),
        inset 0 8px 16px rgba(255, 255, 255, .22),
        inset 0 -10px 18px rgba(90, 60, 5, .35);
    }

    .coin-face.back {
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .4) 0%, transparent 35%),
        radial-gradient(circle at 50% 50%, #e8d9a0 0%, #b8922a 45%, #5c4410 100%);
      color: #1a1408;
      transform: rotateY(180deg) translateZ(5px);
      box-shadow:
        inset 0 0 0 4px rgba(255, 241, 189, .18),
        inset 0 8px 16px rgba(255, 255, 255, .12),
        inset 0 -10px 18px rgba(0, 0, 0, .4);
    }

    .coin-face::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 241, 189, .4);
      pointer-events: none;
    }

    /* Espessura metálica — visível quando a moeda fica de lado */
    .coin-edge {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(90deg, #5c4410, #d4af37 30%, #f1dc93 50%, #d4af37 70%, #5c4410);
      transform: translateZ(0px);
      box-shadow: 0 0 0 1px #4a380c;
    }

    .coin-edge-layer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(180deg, #c9a227, #6b5210);
    }

    .coin-3d.is-flip-cara {
      animation: coinTossCara 1.7s linear forwards;
    }

    .coin-3d.is-flip-coroa {
      animation: coinTossCoroa 1.7s linear forwards;
    }

    /* linear + muitos keyframes = rotação contínua sem “tranco”;
       a altura usa curva de parábola suave */
    @keyframes coinTossCara {
      0% {
        transform: translate3d(0, 0, 0) rotateX(0deg) rotateZ(0deg) scale(1);
      }

      5% {
        transform: translate3d(-2px, -18px, 8px) rotateX(90deg) rotateZ(-3deg) scale(1.02);
      }

      10% {
        transform: translate3d(-4px, -36px, 16px) rotateX(180deg) rotateZ(-6deg) scale(1.04);
      }

      15% {
        transform: translate3d(-5px, -52px, 22px) rotateX(270deg) rotateZ(-7deg) scale(1.06);
      }

      20% {
        transform: translate3d(-4px, -68px, 28px) rotateX(360deg) rotateZ(-6deg) scale(1.07);
      }

      25% {
        transform: translate3d(-2px, -80px, 32px) rotateX(450deg) rotateZ(-4deg) scale(1.08);
      }

      30% {
        transform: translate3d(0, -90px, 36px) rotateX(540deg) rotateZ(-1deg) scale(1.09);
      }

      35% {
        transform: translate3d(2px, -98px, 38px) rotateX(630deg) rotateZ(2deg) scale(1.09);
      }

      40% {
        transform: translate3d(3px, -102px, 40px) rotateX(720deg) rotateZ(4deg) scale(1.1);
      }

      45% {
        transform: translate3d(4px, -104px, 40px) rotateX(810deg) rotateZ(5deg) scale(1.1);
      }

      50% {
        transform: translate3d(3px, -102px, 38px) rotateX(900deg) rotateZ(4deg) scale(1.09);
      }

      55% {
        transform: translate3d(2px, -96px, 34px) rotateX(990deg) rotateZ(3deg) scale(1.08);
      }

      60% {
        transform: translate3d(0, -86px, 30px) rotateX(1080deg) rotateZ(1deg) scale(1.07);
      }

      65% {
        transform: translate3d(-2px, -74px, 24px) rotateX(1170deg) rotateZ(-1deg) scale(1.05);
      }

      70% {
        transform: translate3d(-3px, -58px, 18px) rotateX(1260deg) rotateZ(-3deg) scale(1.04);
      }

      75% {
        transform: translate3d(-2px, -42px, 12px) rotateX(1350deg) rotateZ(-2deg) scale(1.02);
      }

      80% {
        transform: translate3d(-1px, -26px, 6px) rotateX(1440deg) rotateZ(-1deg) scale(1.01);
      }

      85% {
        transform: translate3d(0, -12px, 2px) rotateX(1530deg) rotateZ(0deg) scale(1);
      }

      90% {
        transform: translate3d(0, 4px, 0) rotateX(1620deg) rotateZ(0deg) scale(0.97, 1.04);
      }

      94% {
        transform: translate3d(0, -6px, 0) rotateX(1700deg) rotateZ(0deg) scale(1.02, 0.98);
      }

      97% {
        transform: translate3d(0, 2px, 0) rotateX(1760deg) rotateZ(0deg) scale(0.99, 1.01);
      }

      100% {
        transform: translate3d(0, 0, 0) rotateX(1800deg) rotateZ(0deg) scale(1);
      }
    }

    @keyframes coinTossCoroa {
      0% {
        transform: translate3d(0, 0, 0) rotateX(0deg) rotateZ(0deg) scale(1);
      }

      5% {
        transform: translate3d(2px, -18px, 8px) rotateX(90deg) rotateZ(3deg) scale(1.02);
      }

      10% {
        transform: translate3d(4px, -36px, 16px) rotateX(180deg) rotateZ(6deg) scale(1.04);
      }

      15% {
        transform: translate3d(5px, -52px, 22px) rotateX(270deg) rotateZ(7deg) scale(1.06);
      }

      20% {
        transform: translate3d(4px, -68px, 28px) rotateX(360deg) rotateZ(6deg) scale(1.07);
      }

      25% {
        transform: translate3d(2px, -80px, 32px) rotateX(450deg) rotateZ(4deg) scale(1.08);
      }

      30% {
        transform: translate3d(0, -90px, 36px) rotateX(540deg) rotateZ(1deg) scale(1.09);
      }

      35% {
        transform: translate3d(-2px, -98px, 38px) rotateX(630deg) rotateZ(-2deg) scale(1.09);
      }

      40% {
        transform: translate3d(-3px, -102px, 40px) rotateX(720deg) rotateZ(-4deg) scale(1.1);
      }

      45% {
        transform: translate3d(-4px, -104px, 40px) rotateX(810deg) rotateZ(-5deg) scale(1.1);
      }

      50% {
        transform: translate3d(-3px, -102px, 38px) rotateX(900deg) rotateZ(-4deg) scale(1.09);
      }

      55% {
        transform: translate3d(-2px, -96px, 34px) rotateX(990deg) rotateZ(-3deg) scale(1.08);
      }

      60% {
        transform: translate3d(0, -86px, 30px) rotateX(1080deg) rotateZ(-1deg) scale(1.07);
      }

      65% {
        transform: translate3d(2px, -74px, 24px) rotateX(1170deg) rotateZ(1deg) scale(1.05);
      }

      70% {
        transform: translate3d(3px, -58px, 18px) rotateX(1260deg) rotateZ(3deg) scale(1.04);
      }

      75% {
        transform: translate3d(2px, -42px, 12px) rotateX(1350deg) rotateZ(2deg) scale(1.02);
      }

      80% {
        transform: translate3d(1px, -26px, 6px) rotateX(1440deg) rotateZ(1deg) scale(1.01);
      }

      85% {
        transform: translate3d(0, -12px, 2px) rotateX(1530deg) rotateZ(0deg) scale(1);
      }

      90% {
        transform: translate3d(0, 4px, 0) rotateX(1710deg) rotateZ(0deg) scale(0.97, 1.04);
      }

      94% {
        transform: translate3d(0, -6px, 0) rotateX(1840deg) rotateZ(0deg) scale(1.02, 0.98);
      }

      97% {
        transform: translate3d(0, 2px, 0) rotateX(1920deg) rotateZ(0deg) scale(0.99, 1.01);
      }

      100% {
        transform: translate3d(0, 0, 0) rotateX(1980deg) rotateZ(0deg) scale(1);
      }
    }

    .slot-machine-reel {
      position: relative;
      perspective: 900px;
      overflow: hidden;
    }

    .slot-machine-reel::before,
    .slot-machine-reel::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 24%;
      z-index: 2;
      pointer-events: none;
    }

    .slot-machine-reel::before {
      top: 0;
      background: linear-gradient(#0b0d0c, transparent);
      opacity: .28;
    }

    .slot-machine-reel::after {
      bottom: 0;
      background: linear-gradient(transparent, #0b0d0c);
      opacity: .3;
    }

    .slot-machine-reel .slot-symbol {
      will-change: transform, filter;
    }

    .slot-machine-reel.spinning .slot-symbol {
      animation: slotReelSpinReal .16s cubic-bezier(.2, .65, .35, 1) infinite;
    }

    @keyframes slotReelSpinReal {
      0% {
        transform: translateY(-92px) rotateX(18deg) scale(.86);
        filter: blur(5px);
        opacity: .55;
      }

      48% {
        transform: translateY(0) rotateX(0) scale(1);
        filter: blur(1.5px);
        opacity: 1;
      }

      100% {
        transform: translateY(92px) rotateX(-18deg) scale(.86);
        filter: blur(5px);
        opacity: .55;
      }
    }

    .slot-machine-reel.reel-stop .slot-symbol {
      animation: slotReelStop .34s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes slotReelStop {
      0% {
        transform: translateY(-24px) scale(.98);
        filter: blur(2px);
      }

      65% {
        transform: translateY(5px) scale(1.03);
        filter: blur(0);
      }

      100% {
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .tower-camera {
      transition: transform .72s cubic-bezier(.22, 1, .36, 1);
      will-change: transform;
    }

    .tower-block-in {
      animation: towerBlockIn .42s cubic-bezier(.2, 1.4, .4, 1) both;
    }

    @keyframes towerBlockIn {
      0% {
        transform: translateY(30px) scale(.75);
        opacity: 0;
      }

      70% {
        transform: translateY(-3px) scale(1.04);
        opacity: 1;
      }

      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .tower-man-rise {
      animation: towerManRise .55s cubic-bezier(.2, .8, .25, 1) both;
    }

    @keyframes towerManRise {
      0% {
        transform: translateY(42px) scale(.9);
      }

      55% {
        transform: translateY(-7px) scale(1.04);
      }

      100% {
        transform: translateY(0) scale(1);
      }
    }

    .tower-block-fall {
      animation: towerBlockFall .72s cubic-bezier(.55, .05, .8, .25) both;
    }

    @keyframes towerBlockFall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      35% {
        transform: translateY(12px) rotate(calc(var(--fall-rotate) * .25));
        opacity: 1;
      }

      100% {
        transform: translateY(210px) rotate(var(--fall-rotate));
        opacity: 0;
      }
    }

    .tower-man-fall {
      animation: towerManFall .82s cubic-bezier(.55, .05, .8, .25) both;
    }

    @keyframes towerManFall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      35% {
        transform: translateY(28px) rotate(8deg);
        opacity: 1;
      }

      62% {
        transform: translateY(78px) rotate(35deg);
        opacity: 1;
      }

      100% {
        transform: translateY(180px) rotate(82deg);
        opacity: 0;
      }
    }

    .plinko-ball {
      transition: opacity .2s ease;
      will-change: left, top, transform;
      background: radial-gradient(circle at 32% 28%, #fff 0%, #f4d978 35%, #c9a227 70%, #6b4e0e 100%);
      border: 2px solid #fff1bd;
      box-shadow: 0 0 14px rgba(244, 217, 120, .55), 0 4px 10px rgba(0, 0, 0, .45);
    }

    .plinko-ball-bounce {
      animation: plinkoBounce .18s cubic-bezier(.2, .8, .3, 1);
    }

    @keyframes plinkoBounce {
      0% {
        transform: translate(-50%, -50%) scale(1);
      }

      40% {
        transform: translate(-50%, -50%) scale(1.28);
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .plinko-bucket-hit {
      animation: bucketPulse .55s ease-out;
      box-shadow: 0 0 18px rgba(244, 217, 120, .55) !important;
    }

    @keyframes bucketPulse {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }
    }

    .plinko-peg {
      width: 10px !important;
      height: 10px !important;
      border: none !important;
      border-radius: 50% !important;
      background: radial-gradient(circle at 30% 30%, #f7e08a, #c9a227 55%, #6a5210) !important;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .5), inset 0 1px 1px rgba(255, 255, 255, .35);
      filter: none !important;
    }

    @keyframes chipBadgeBounce {
      0% {
        transform: translateY(0);
      }

      12% {
        transform: translateY(-9px);
      }

      24% {
        transform: translateY(0);
      }

      36% {
        transform: translateY(-6px);
      }

      48% {
        transform: translateY(0);
      }

      60% {
        transform: translateY(-3px);
      }

      72%,
      100% {
        transform: translateY(0);
      }
    }

    .chip-badge-bounce {
      animation: chipBadgeBounce 0.85s ease-out forwards;
    }

    .crash-stage {
      position: relative;
      isolation: isolate;
      border-radius: 16px;
      background:
        radial-gradient(ellipse 90% 55% at 50% 115%, rgba(201, 162, 39, .16), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 10%, rgba(56, 100, 180, .14), transparent 50%),
        radial-gradient(ellipse 60% 40% at 15% 20%, rgba(120, 60, 160, .1), transparent 55%),
        linear-gradient(165deg, #050a14 0%, #0a1424 38%, #0c1018 72%, #0a0c10 100%);
      box-shadow:
        inset 0 0 60px rgba(0, 0, 0, .55),
        inset 0 1px 0 rgba(255, 255, 255, .04),
        0 0 0 1px rgba(212, 175, 55, .14),
        0 12px 28px rgba(0, 0, 0, .35);
      overflow: hidden;
    }

    .crash-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse 100% 40% at 50% 100%, rgba(201, 162, 39, .12), transparent 60%),
        linear-gradient(180deg, rgba(5, 10, 20, .15) 0%, transparent 35%, transparent 70%, rgba(0, 0, 0, .35) 100%);
    }

    .crash-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, .5);
      border-radius: inherit;
    }

    .crash-sky {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 72% 18%, rgba(90, 140, 220, .12) 0%, transparent 28%),
        radial-gradient(circle at 20% 35%, rgba(160, 90, 200, .08) 0%, transparent 32%);
      animation: crashSkyPulse 7s ease-in-out infinite alternate;
    }

    .crash-horizon {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -8%;
      height: 42%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 70% at 50% 100%, rgba(201, 162, 39, .22) 0%, rgba(180, 90, 30, .08) 35%, transparent 70%);
      filter: blur(1px);
    }

    .crash-stage.playing {
      box-shadow:
        inset 0 0 60px rgba(0, 0, 0, .5),
        inset 0 1px 0 rgba(255, 255, 255, .05),
        0 0 0 1px rgba(212, 175, 55, .22),
        0 0 36px rgba(212, 175, 55, .14);
    }

    .crash-stage.playing .crash-horizon {
      background:
        radial-gradient(ellipse 80% 70% at 50% 100%, rgba(241, 215, 122, .28) 0%, rgba(201, 120, 40, .12) 40%, transparent 72%);
    }

    .crash-stage.crashed {
      animation: crashStageShake .55s cubic-bezier(.2, .9, .25, 1) both;
      box-shadow:
        inset 0 0 70px rgba(120, 20, 30, .4),
        0 0 0 1px rgba(248, 113, 113, .25),
        0 0 36px rgba(248, 113, 113, .2);
    }

    .crash-stage.crashed .crash-horizon {
      background:
        radial-gradient(ellipse 80% 70% at 50% 100%, rgba(248, 113, 113, .28) 0%, rgba(120, 20, 30, .12) 40%, transparent 72%);
    }

    .crash-stage.cashed {
      animation: crashStageWin .6s cubic-bezier(.2, .9, .25, 1) both;
      box-shadow:
        inset 0 0 70px rgba(20, 80, 50, .35),
        0 0 0 1px rgba(52, 211, 153, .25),
        0 0 36px rgba(52, 211, 153, .18);
    }

    .crash-stage.cashed .crash-horizon {
      background:
        radial-gradient(ellipse 80% 70% at 50% 100%, rgba(52, 211, 153, .26) 0%, rgba(20, 80, 50, .1) 40%, transparent 72%);
    }

    @keyframes crashSkyPulse {
      from {
        opacity: .7;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes crashStageShake {

      0%,
      100% {
        transform: translateX(0);
      }

      15% {
        transform: translateX(-5px) scale(1.01);
      }

      30% {
        transform: translateX(5px);
      }

      45% {
        transform: translateX(-3px);
      }

      60% {
        transform: translateX(3px);
      }

      75% {
        transform: translateX(-1px);
      }
    }

    @keyframes crashStageWin {
      0% {
        filter: brightness(1);
      }

      35% {
        filter: brightness(1.18);
      }

      100% {
        filter: brightness(1);
      }
    }

    .crash-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: .65;
      z-index: 1;
    }

    .crash-star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #f1d77a;
      box-shadow: 0 0 4px rgba(241, 215, 122, .8);
      animation: crashStarTwinkle 2.8s ease-in-out infinite;
    }

    @keyframes crashStarTwinkle {

      0%,
      100% {
        opacity: .25;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    .crash-graph-line {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 2;
    }

    .crash-graph-area {
      fill: rgba(214, 178, 74, .1);
      transition: fill .35s ease;
    }

    .crash-graph-glow {
      fill: none;
      stroke: rgba(224, 189, 85, .22);
      stroke-width: 8;
      vector-effect: non-scaling-stroke;
      filter: blur(3px);
    }

    .crash-graph-line path:not(.crash-graph-area):not(.crash-graph-glow) {
      fill: none;
      stroke: #e0bd55;
      stroke-width: 2.8;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(224, 189, 85, .5));
      transition: stroke .3s ease, filter .3s ease;
    }

    .crash-stage.crashed .crash-graph-line path:not(.crash-graph-area):not(.crash-graph-glow) {
      stroke: #f87171;
      filter: drop-shadow(0 0 10px rgba(248, 113, 113, .55));
    }

    .crash-stage.crashed .crash-graph-area {
      fill: rgba(248, 113, 113, .12);
    }

    .crash-stage.crashed .crash-graph-glow {
      stroke: rgba(248, 113, 113, .28);
    }

    .crash-stage.crashed .crash-trail-dot {
      background: #f87171;
      box-shadow: 0 0 10px rgba(248, 113, 113, .65);
    }

    .crash-stage.cashed .crash-graph-line path:not(.crash-graph-area):not(.crash-graph-glow) {
      stroke: #34d399;
      filter: drop-shadow(0 0 10px rgba(52, 211, 153, .5));
    }

    .crash-stage.cashed .crash-graph-area {
      fill: rgba(52, 211, 153, .12);
    }

    .crash-stage.cashed .crash-graph-glow {
      stroke: rgba(52, 211, 153, .28);
    }

    .crash-plane {
      position: absolute;
      transition: left .05s linear, top .05s linear, transform .05s linear;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .6));
      will-change: left, top, transform;
      z-index: 4;
      backface-visibility: hidden;
    }

    .crash-plane.is-flying .crash-plane-icon {
      animation: crashRocketBob .55s ease-in-out infinite;
    }

    .crash-plane.is-flying .crash-flame {
      opacity: 1;
      animation: crashFlamePulse .18s ease-in-out infinite alternate;
    }

    .crash-plane-icon {
      display: block;
      line-height: 1;
      font-size: 2.5rem;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, .6));
      transform-origin: 50% 50%;
    }

    .crash-flame {
      position: absolute;
      left: 50%;
      bottom: -2px;
      width: 14px;
      height: 22px;
      margin-left: -7px;
      border-radius: 50% 50% 40% 40%;
      background: radial-gradient(circle at 50% 20%, #fff7c2, #fbbf24 35%, #f97316 65%, transparent 80%);
      opacity: 0;
      filter: blur(.4px);
      pointer-events: none;
      z-index: -1;
      transform: translateY(8px) rotate(180deg);
    }

    @keyframes crashRocketBob {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @keyframes crashFlamePulse {
      from {
        transform: translateY(8px) rotate(180deg) scaleY(1) scaleX(.9);
        opacity: .85;
      }

      to {
        transform: translateY(10px) rotate(180deg) scaleY(1.25) scaleX(1.05);
        opacity: 1;
      }
    }

    .crash-multiplier {
      position: absolute;
      left: 5%;
      top: 5%;
      z-index: 5;
      font-size: clamp(2.7rem, 7vw, 4.2rem);
      line-height: .9;
      font-weight: 950;
      letter-spacing: -.045em;
      color: #f1d77a;
      text-shadow: 0 4px 18px rgba(0, 0, 0, .75), 0 0 24px rgba(214, 178, 74, .2);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      transition: color .3s ease, text-shadow .3s ease, transform .2s ease;
    }

    .crash-multiplier.is-live {
      animation: crashMultiPulse 1.1s ease-in-out infinite;
    }

    .crash-multiplier.crashed {
      color: #f87171;
      text-shadow: 0 4px 18px rgba(0, 0, 0, .75), 0 0 28px rgba(248, 113, 113, .4);
      animation: crashMultiPop .45s cubic-bezier(.2, 1.2, .3, 1) both;
    }

    .crash-multiplier.cashed {
      color: #34d399;
      text-shadow: 0 4px 18px rgba(0, 0, 0, .75), 0 0 28px rgba(52, 211, 153, .4);
      animation: crashMultiPop .45s cubic-bezier(.2, 1.2, .3, 1) both;
    }

    @keyframes crashMultiPulse {

      0%,
      100% {
        transform: scale(1);
        filter: brightness(1);
      }

      50% {
        transform: scale(1.03);
        filter: brightness(1.12);
      }
    }

    @keyframes crashMultiPop {
      0% {
        transform: scale(.85);
        opacity: .6;
      }

      55% {
        transform: scale(1.12);
        opacity: 1;
      }

      100% {
        transform: scale(1);
      }
    }

    .crash-status {
      position: absolute;
      left: 5%;
      top: calc(5% + 3.8rem);
      z-index: 5;
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .22em;
      text-transform: uppercase;
      pointer-events: none;
      color: #a99f8c;
      animation: crashStatusIn .4s ease-out both;
    }

    .crash-status.crashed {
      color: #f87171;
    }

    .crash-status.cashed {
      color: #34d399;
    }

    .crash-status.idle {
      color: #8b8474;
      letter-spacing: .16em;
    }

    @keyframes crashStatusIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .crash-trail-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: #f1d77a;
      box-shadow: 0 0 8px rgba(241, 215, 122, .65);
      pointer-events: none;
      z-index: 3;
    }

    .crash-grid-layer {
      position: absolute;
      inset: 0;
      opacity: .12;
      pointer-events: none;
      z-index: 1;
      background-image:
        linear-gradient(rgba(140, 165, 190, .18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 165, 190, .18) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 75%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 75%, transparent 100%);
      animation: crashGridDrift 22s linear infinite;
    }

    .crash-stage.playing .crash-grid-layer {
      opacity: .18;
    }

    @keyframes crashGridDrift {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 34px -34px;
      }
    }

    .crash-explosion {
      animation: crashExplosion .65s cubic-bezier(.2, .9, .25, 1) both !important;
      transition: none !important;
    }

    @keyframes crashExplosion {
      0% {
        transform: translate3d(-50%, -50%, 0) scale(.2);
        opacity: 0;
        filter: brightness(2);
      }

      40% {
        transform: translate3d(-50%, -50%, 0) scale(1.45);
        opacity: 1;
        filter: brightness(1.4);
      }

      70% {
        transform: translate3d(-50%, -50%, 0) scale(1.1);
        opacity: 1;
      }

      100% {
        transform: translate3d(-50%, -50%, 0) scale(1);
        opacity: 1;
        filter: brightness(1);
      }
    }

    .crash-boom-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border-radius: 50%;
      border: 2px solid rgba(248, 113, 113, .85);
      pointer-events: none;
      z-index: 6;
      animation: crashBoomRing .7s ease-out forwards;
    }

    @keyframes crashBoomRing {
      0% {
        transform: scale(.4);
        opacity: 1;
      }

      100% {
        transform: scale(6);
        opacity: 0;
      }
    }

    .crash-cash-btn {
      animation: crashCashGlow 1.4s ease-in-out infinite;
    }

    @keyframes crashCashGlow {

      0%,
      100% {
        box-shadow: 0 0 18px rgba(245, 158, 11, .22);
      }

      50% {
        box-shadow: 0 0 32px rgba(245, 158, 11, .42), 0 0 0 2px rgba(251, 191, 36, .2);
      }
    }

    .crash-hist-chip {
      animation: crashHistIn .35s cubic-bezier(.2, .9, .25, 1) both;
    }

    @keyframes crashHistIn {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(.9);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .crash-stage.crashed,
      .crash-stage.cashed,
      .crash-plane.is-flying .crash-plane-icon,
      .crash-plane.is-flying .crash-flame,
      .crash-multiplier.is-live,
      .crash-multiplier.crashed,
      .crash-multiplier.cashed,
      .crash-grid-layer,
      .crash-star,
      .crash-cash-btn,
      .crash-explosion,
      .crash-boom-ring {
        animation: none !important;
      }
    }

    .anim-pop,

      }

        transform: scale(1.18);

      }

        opacity: 1
      }

    @keyframes safeFeedbackIn {

      }

        opacity: 1;
        transform: translateY(2px) scale(1.02)
      }

      }

    @keyframes safeActivePulse {

      100% {

    /* === ANIMAÇÕES OBRIGATÓRIAS: GANHO E PERDA === */
    @keyframes winPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }

      40% {
        transform: scale(1.08);
        box-shadow: 0 0 30px 8px rgba(16, 185, 129, 0.5);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    @keyframes lossShake {

      0%,
      100% {
        transform: translateX(0);
      }

      15% {
        transform: translateX(-8px) rotate(-1deg);
      }

      30% {
        transform: translateX(8px) rotate(1deg);
      }

      45% {
        transform: translateX(-6px);
      }

      60% {
        transform: translateX(6px);
      }

      75% {
        transform: translateX(-3px);
      }

      90% {
        transform: translateX(3px);
      }
    }

    @keyframes winFlash {
      0% {
        background: rgba(16, 185, 129, 0);
      }

      30% {
        background: rgba(16, 185, 129, 0.25);
      }

      100% {
        background: rgba(16, 185, 129, 0);
      }
    }

    @keyframes lossFlash {
      0% {
        background: rgba(239, 68, 68, 0);
      }

      30% {
        background: rgba(239, 68, 68, 0.3);
      }

      100% {
        background: rgba(239, 68, 68, 0);
      }
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      60% {
        transform: scale(1.15);
        opacity: 1;
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0.2) translateY(30px);
        opacity: 0;
      }

      55% {
        transform: scale(1.12) translateY(-6px);
        opacity: 1;
      }

      75% {
        transform: scale(0.96) translateY(2px);
      }

      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .anim-win {
      animation: winPulse 0.8s ease-out;
    }

    .anim-loss {
      animation: lossShake 0.6s ease-in-out;
    }

    .anim-win-flash {
      animation: winFlash 0.7s ease-out;
    }

    .anim-loss-flash {
      animation: lossFlash 0.7s ease-out;
    }

    .anim-pop {
      animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .anim-bounce {
      animation: bounceIn 0.5s ease-out;
    }

    /* Botões: hover + active em tudo */
    button {
      transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    button:not(:disabled):hover {
      transform: translateY(-1px) scale(1.03);

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

    // --- SINTETIZADOR DE ÁUDIO WEB EXPANDIDO ---
    const playSoundEffect = (type, volume = 80) => {
      try {
        if (volume <= 0) return;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const volRatio = volume / 100;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'button' || type === 'confirm') {
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.setValueAtTime(600, now + 0.03);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'chip_select') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'chip_place') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
          gain.gain.setValueAtTime(0.15 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'roulette_spin') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
          gain.gain.setValueAtTime(0.08 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'ball_stop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.setValueAtTime(1400, now + 0.04);
          gain.gain.setValueAtTime(0.2 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'win') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.2 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'blackjack') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          osc.frequency.setValueAtTime(1046.50, now + 0.24);
          gain.gain.setValueAtTime(0.25 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
          osc.start(now); osc.stop(now + 0.6);
        } else if (type === 'loss' || type === 'bust') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
          gain.gain.setValueAtTime(0.2 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        } else if (type === 'tie') {
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.15 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'card' || type === 'hit') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
          gain.gain.setValueAtTime(0.12 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
          osc.start(now); osc.stop(now + 0.04);
        } else if (type === 'flip') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(600, now + 0.06);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
          osc.start(now); osc.stop(now + 0.06);
        } else if (type === 'dice') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'slots') {
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.setValueAtTime(1200, now + 0.05);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'explosion') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
          gain.gain.setValueAtTime(0.3 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'coin') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.setValueAtTime(1600, now + 0.1);
          gain.gain.setValueAtTime(0.1 * volRatio, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        }
      } catch (e) { console.log('Audio Context error or user interaction required'); }
    };

    const DieFace = React.memo(({ value = 1, rolling = false, size = 56, color = 'ivory', delay = false }) => {
      const [display, setDisplay] = useState(value);
      const [land, setLand] = useState(false);
      const prevRolling = useRef(false);
      useEffect(() => {
        if (rolling) {
          prevRolling.current = true;
          setLand(false);
          const iv = setInterval(() => setDisplay(1 + Math.floor(Math.random() * 6)), 140);
          return () => clearInterval(iv);
        }
        setDisplay(value);
        if (prevRolling.current) {
          prevRolling.current = false;
          setLand(true);
          const t = setTimeout(() => setLand(false), 560);
          return () => clearTimeout(t);
        }
      }, [rolling, value]);
      const pips = DIE_PIPS[Math.min(6, Math.max(1, display))] || DIE_PIPS[1];
      return (
        <div
          className={cn('die-face', color, rolling && 'rolling', rolling && delay && 'rolling-delay', land && 'land')}
          style={{ width: size, height: size }}
          aria-label={`Dado ${display}`}
        >
          {pips.map(([x, y], i) => (
            <span key={i} className="pip" style={{ left: `${x}%`, top: `${y}%` }} />
          ))}
        </div>
      );
    });

    const DieD100 = React.memo(({ value = 0, rolling = false, size = 64 }) => {
      const clamped = Math.min(99.99, Math.max(0, Number(value) || 0));
      const tensFinal = Math.floor(clamped / 10) * 10;
      const onesFinal = Math.floor(clamped) % 10;
      const tensRef = useRef(null);
      const onesRef = useRef(null);
      const [land, setLand] = useState(false);
      const prevRolling = useRef(false);
      useEffect(() => {
        if (rolling) {
          prevRolling.current = true;
          setLand(false);
          const write = (el, t) => { const n = el && el.querySelector('.die-num'); if (n) n.textContent = t; };
          const iv = setInterval(() => {
            write(tensRef.current, String(Math.floor(Math.random() * 10) * 10).padStart(2, '0'));
            write(onesRef.current, String(Math.floor(Math.random() * 10)));
          }, 140);
          return () => clearInterval(iv);
        }
        const write = (el, t) => { const n = el && el.querySelector('.die-num'); if (n) n.textContent = t; };
        write(tensRef.current, String(tensFinal).padStart(2, '0'));
        write(onesRef.current, String(onesFinal));
        if (prevRolling.current) {
          prevRolling.current = false;
          setLand(true);
          const t = setTimeout(() => setLand(false), 560);
          return () => clearTimeout(t);
        }
      }, [rolling, value, tensFinal, onesFinal]);
      const face = (label, text, delayed, ref) => (
        <div
          ref={ref}
          className={cn('die-face numeric ivory', rolling && 'rolling', rolling && delayed && 'rolling-delay', land && 'land')}
          style={{ width: size, height: size, fontSize: size * 0.38 }}
          aria-label={label}
        >
          <span className="die-num">{String(text).padStart(label === 'dezenas' ? 2 : 1, '0')}</span>
          <span className="die-label">{label === 'dezenas' ? 'dezenas' : 'unidades'}</span>
        </div>
      );
      return (
        <div className="flex items-center justify-center gap-3">
          {face('dezenas', tensFinal, false, tensRef)}
          {face('unidades', onesFinal, true, onesRef)}
        </div>
      );
    });

        let marketEffectUsed = null;
        const stakeForEffect = betAmts.current[betId] || 0;
        const lostRound = stakeForEffect > 0 && (finalWin <= 0 || refunded);
        const offerDefeat = lostRound;
        if (lostRound) {
          // Derrota: as vantagens (Passe de Revanche, Escudo...) são oferecidas na tela de derrota
        } else if (finalWin > stakeForEffect && (activeMarketEffects.boost > 0 || activeMarketEffects.winCredit > 0)) {
          if (activeMarketEffects.boost > 0) finalWin += (finalWin - stakeForEffect) * (activeMarketEffects.boost / 100);
          if (activeMarketEffects.winCredit > 0) finalWin += activeMarketEffects.winCredit;
          marketEffectUsed = 'win';
          finalDetails += ' (bônus consumível aplicado)';
        }
        if (marketEffectUsed === 'retry' || marketEffectUsed === 'shield') {
          setActiveMarketEffects(prev => ({ ...prev, [marketEffectUsed]: Math.max(0, (Number(prev[marketEffectUsed]) || 0) - 1) }));
        } else if (marketEffectUsed === 'win') {
          setActiveMarketEffects(prev => ({ ...prev, boost: 0, winCredit: 0 }));
        }

        if (hackSettings.frozenBalance) {
          finalDetails += ' [SALDO CONGELADO]';
        }

        setBalance(prev => {
          const finalBal = hackSettings.frozenBalance ? prev : Math.max(0, prev + finalWin);
          setHistory(hist => hist.map(h =>
            h.id === betId ? { ...h, status: finalWin > 0 && (!refunded || marketEffectUsed === 'win') ? 'win' : 'loss', won: finalWin, result: finalDetails, balanceAfter: finalBal } : h
          ));

          // Revela vitória/perda após 1s (todos os jogos passam por settleBet)
          const revealWin = finalWin > 0 && (!refunded || marketEffectUsed === 'win');
          const revealRetry = marketEffectUsed === 'retry' || marketEffectUsed === 'shield';
          const revealDefeat = offerDefeat;
          setTimeout(() => {
            if (revealRetry) {
              showNotification(marketEffectUsed === 'retry' ? '🛡️ Passe de Revanche ativado: sua aposta foi devolvida para tentar novamente.' : '🛡️ Escudo ativado: metade da aposta foi devolvida.', 'success');
            } else if (revealWin) {
              showNotification(`🎉 Ganho fictício: ${formatMoney(finalWin)}!`, 'success');
              if (hackSettings.effectsEnabled) playSoundEffect('win', hackSettings.sfxVolume);
              triggerResultAnim('win', `+ ${formatMoney(finalWin)}`, finalWin);
            } else if (revealDefeat) {
              if (hackSettings.effectsEnabled) playSoundEffect('loss', hackSettings.sfxVolume);
              setDefeatCtx({ betId, stake: stakeForEffect, delta: hackSettings.frozenBalance ? 0 : finalWin, details: finalDetails, canResume: typeof reviveRegistry.current[betId] === 'function', key: Date.now() });
            } else {
              showNotification(`💥 Você perdeu esta rodada.`, 'error');
              if (hackSettings.effectsEnabled) playSoundEffect('loss', hackSettings.sfxVolume);
              triggerResultAnim('loss', 'PERDEU', 0);
            }
          }, 1000);
          return finalBal;
        });

        updateDebug({
          roundState: 'idle', lastResult: finalDetails,
          lastEvent: `Rodada finalizada: ${finalWin > 0 ? 'Ganho ' + formatMoney(finalWin) : 'Perda'}`
        });

        if (hackSettings.nextOutcome !== 'normal') {
          setHackSettings(prev => ({ ...prev, nextOutcome: 'normal' }));
        }
      };

      }, []);
