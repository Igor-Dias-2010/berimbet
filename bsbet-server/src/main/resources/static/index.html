          <div className="flex justify-between font-mono"><span className="text-slate-400 text-sm">Multiplicador</span><span className="text-amber-400 font-black text-xl">{mult.toFixed(2)}x → {formatMoney(bet * mult)}</span></div>
          <canvas ref={cv} width={W} height={H} className="w-full bg-slate-950 border border-slate-800 rounded-xl" />
          {st === 'playing' ? (<>
            <div className="flex gap-2"><button {...hold('l', true)} className="flex-1 bg-slate-800 py-4 rounded-lg font-black text-white">◀ ESQ</button><button {...hold('r', true)} className="flex-1 bg-slate-800 py-4 rounded-lg font-black text-white">DIR ▶</button></div>
            <button onClick={cash} className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-lg">SACAR {formatMoney(bet * mult)}</button>
          </>) : (
            <div className="flex gap-2"><input type="number" min="0.5" step="0.5" value={bet} onChange={e => setBet(Number(e.target.value))} className="bg-slate-950 border border-slate-800 p-3 text-center rounded-lg text-white w-28" /><button onClick={start} className="flex-1 bg-emerald-500 text-slate-950 font-bold py-3 rounded-lg">{st === 'done' ? 'JOGAR DE NOVO' : 'LANÇAR BOLA'}</button></div>
          )}
        </div>
      );
    };

    const InventoryView = () => {
      const { marketPurchases, setMarketPurchases, setBalance, setChips, activeMarketEffects, setActiveMarketEffects, showNotification, setView } = useAppState();
      const [inventoryTab, setInventoryTab] = useState('usable');
      const formatAcquired = (value) => { if (!value) return 'Data não disponível'; const date = new Date(value); return Number.isNaN(date.getTime()) ? 'Data não disponível' : date.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); };
      const removeOne = (item) => {
        if (!window.confirm(`Apagar uma unidade de "${item.name}" do inventário? Não haverá reembolso.`)) return;
        const target = marketPurchases.find(entry => entry.id === item.id);
        if (!target) return;
        setMarketPurchases(prev => { const idx = prev.findIndex(entry => entry.instanceId === target.instanceId); return idx < 0 ? prev : [...prev.slice(0, idx), ...prev.slice(idx + 1)]; });
        showNotification(`Uma unidade de ${item.name} foi removida.`, 'info');
      };
      const useItem = (item) => {
        const definition = MARKET_ITEMS.find(prize => prize.id === item.id);
        const effectType = item.effectType || (definition && definition.effectType) || '';
        const amount = Number(item.effectAmount ?? (definition && definition.effectAmount)) || 0;
        if (item.kind !== 'usable') { showNotification('Este colecionável é decorativo e não tem efeito de jogo.', 'info'); return; }
        if (effectType === 'credit') {
          if (amount > 7500) { showNotification('Limite de segurança: nenhum crédito pode conceder mais de R$ 7.500 por uso.', 'error'); return; }
          setBalance(prev => Math.round((prev + amount) * 100) / 100);
          showNotification(`${item.name} usado: +${formatMoney(amount)} de saldo fictício.`, 'success');
        } else if (effectType === 'chips') {
          setChips(prev => prev + amount);
          showNotification(`${item.name} usado: +${amount} fichas.`, 'success');
        } else if (['retry', 'shield', 'boost', 'winCredit'].includes(effectType)) {
          setActiveMarketEffects(prev => ({ ...prev, [effectType]: (Number(prev[effectType]) || 0) + amount }));
          const descriptions = { retry: 'ficará pronto para usar na tela de derrota', shield: 'ficará pronto para usar na tela de derrota', boost: `aumentará em ${amount}% o lucro da próxima vitória`, winCredit: `adicionará ${formatMoney(amount)} à próxima vitória com lucro` };
          showNotification(`${item.name} ativado: ${descriptions[effectType]}.`, 'success');
        } else { showNotification('O efeito deste item não está disponível.', 'error'); return; }
        const target = marketPurchases.find(entry => entry.instanceId === item.instanceId);
        if (target) setMarketPurchases(prev => { const idx = prev.findIndex(entry => entry.instanceId === target.instanceId); return idx < 0 ? prev : [...prev.slice(0, idx), ...prev.slice(idx + 1)]; });
      };
      const groups = MARKET_ITEMS.filter(item => inventoryTab === 'usable' ? item.kind === 'usable' : item.kind === 'collectible').map(definition => {
        const owned = marketPurchases.filter(item => item.id === definition.id).sort((a, b) => new Date(a.purchasedAt || 0) - new Date(b.purchasedAt || 0));
        return owned.length ? { definition, items: owned, count: owned.length, first: owned[0], latest: owned[owned.length - 1] } : null;
      }).filter(Boolean);
      const countKind = (kind) => marketPurchases.filter(item => (item.kind || (MARKET_ITEMS.find(def => def.id === item.id) || {}).kind) === kind).length;
      return (
        <section className="inventory-page market-panel rounded-2xl border border-amber-500/30 overflow-hidden">
          <div className="market-banner px-4 sm:px-6 py-5 sm:py-6"><button onClick={() => setView('lobby')} className="market-back-btn mb-4 rounded-lg px-3 py-2 text-sm font-bold">← Voltar ao lobby</button><div className="text-[10px] sm:text-xs font-black tracking-[.22em] text-amber-300 uppercase">Seus itens</div><h2 className="text-2xl sm:text-3xl font-black text-white mt-1">🎒 Inventário</h2><p className="text-sm text-slate-300 mt-2 max-w-2xl">Itens agrupados por tipo. A quantidade aparece no cartão; usar ou apagar remove apenas uma unidade. Colecionáveis não concedem vantagens de jogo.</p></div>
          <div className="p-4 sm:p-6 space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3"><div><div className="text-white font-black">{marketPurchases.length} unidade(s) no inventário</div><p className="text-xs text-slate-400 mt-1">Utilizáveis: {countKind('usable')} · Colecionáveis: {countKind('collectible')}</p></div>{marketPurchases.length > 0 && <button onClick={() => { if (!window.confirm('Limpar todo o inventário? Não haverá reembolso e os efeitos já ativados não serão cancelados.')) return; setMarketPurchases([]); showNotification('Inventário limpo. As fichas e o saldo gastos não foram devolvidos.', 'success'); }} className="market-clear-btn rounded-lg px-3 py-2 text-xs sm:text-sm font-bold w-full sm:w-auto">Limpar inventário</button>}</div>
            <div className="market-tabs flex flex-wrap gap-2" role="tablist" aria-label="Categorias do inventário"><button role="tab" aria-selected={inventoryTab === 'usable'} onClick={() => setInventoryTab('usable')} className={`market-tab-btn rounded-lg px-4 py-3 text-sm font-black ${inventoryTab === 'usable' ? 'active' : ''}`}>⚡ Utilizáveis ({countKind('usable')})</button><button role="tab" aria-selected={inventoryTab === 'collectible'} onClick={() => setInventoryTab('collectible')} className={`market-tab-btn rounded-lg px-4 py-3 text-sm font-black ${inventoryTab === 'collectible' ? 'active' : ''}`}>🌌 Colecionáveis ({countKind('collectible')})</button></div>
            {groups.length === 0 ? <div className="inventory-empty rounded-xl p-8 text-center"><div className="text-4xl mb-3">🎒</div><h3 className="font-black text-white">Nenhum {inventoryTab === 'usable' ? 'item utilizável' : 'colecionável'} aqui</h3><p className="text-sm text-slate-400 mt-2">Acesse o mercado para adquirir novos itens.</p><button onClick={() => setView('market')} className="market-buy-btn rounded-lg px-4 py-2 mt-4 text-sm font-black">Ir ao mercado</button></div> : <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{groups.map(({ definition, items, count, first, latest }) => {
              const effectType = definition.effectType || '';
              const acquiredPrice = Number(first.chipPrice ?? definition.chipPrice ?? 0);
              return <article key={definition.id} className="market-inventory-card rounded-xl p-4 flex flex-col gap-3"><div className="flex items-start gap-3 min-w-0"><div className="market-prize-icon rounded-xl w-14 h-14 flex items-center justify-center text-3xl shrink-0">{definition.icon}</div><div className="min-w-0 flex-1"><h3 className="font-black text-white break-words">{definition.name}</h3><span className="inline-block mt-1 text-[10px] uppercase tracking-wider font-black rounded-full px-2 py-1 border border-amber-500/25 text-amber-300">{definition.kind === 'usable' ? 'Utilizável' : 'Colecionável'}</span><div className="text-sm font-black text-emerald-300 mt-2">{count}X</div></div></div><p className="text-sm text-slate-300 leading-relaxed">{definition.desc}</p>
                {definition.kind === 'usable' && effectType === 'credit' && <p className="text-xs text-emerald-300">Efeito: +{formatMoney(definition.effectAmount)} de saldo fictício por unidade.</p>}
                {definition.kind === 'usable' && effectType === 'retry' && <p className="text-xs text-emerald-300">Efeito: na tela de derrota, retoma a partida no ponto exato em que você parou (Crash, Cara ou Coroa, Tower, Balão, Campo Minado, High-Low, Blackjack etc.); nos demais jogos devolve a aposta.</p>}
                {definition.kind === 'usable' && effectType === 'shield' && <p className="text-xs text-emerald-300">Efeito: devolve 50% da próxima aposta perdida.</p>}
                {definition.kind === 'usable' && effectType === 'boost' && <p className="text-xs text-emerald-300">Efeito: +{definition.effectAmount}% sobre o lucro da próxima vitória.</p>}
                {definition.kind === 'usable' && effectType === 'winCredit' && <p className="text-xs text-emerald-300">Efeito: +{formatMoney(definition.effectAmount)} na próxima vitória com lucro.</p>}
                {definition.kind === 'usable' && effectType === 'chips' && <p className="text-xs text-emerald-300">Efeito: +{definition.effectAmount} fichas por unidade.</p>}
                <div className="inventory-meta flex flex-col gap-1 border-t border-amber-500/15 pt-3"><span className="text-xs text-slate-400">Primeira aquisição: {formatAcquired(first.purchasedAt)}</span><span className="text-xs text-slate-400">Última aquisição: {formatAcquired(latest.purchasedAt)}</span><span className="text-xs text-amber-300">Custo unitário: {acquiredPrice.toLocaleString('pt-BR')} 🪙 + {formatMoney(Number(first.cashPrice ?? definition.cashPrice ?? 0))}</span></div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">{definition.kind === 'usable' && <button onClick={() => useItem(first)} className="market-buy-btn w-full rounded-lg py-2.5 px-3 text-sm font-black">USAR 1 UNIDADE</button>}<button onClick={() => removeOne(first)} aria-label={`Apagar uma unidade de ${definition.name}`} className="market-delete-btn w-full rounded-lg px-3 py-2.5 text-sm font-bold">Apagar 1 unidade</button></div>
              </article>;
            })}</div>}
            {Object.values(activeMarketEffects || {}).some(v => Number(v) > 0) && <div className="market-active-effects rounded-xl p-4"><h3 className="text-white font-black">✨ Vantagens ativadas</h3><p className="text-xs text-slate-300 mt-1">{activeMarketEffects.retry > 0 ? `Passe de Revanche: ${activeMarketEffects.retry} · ` : ''}{activeMarketEffects.shield > 0 ? `Escudo: ${activeMarketEffects.shield} · ` : ''}{activeMarketEffects.boost > 0 ? `Bônus de lucro: +${activeMarketEffects.boost}% · ` : ''}{activeMarketEffects.winCredit > 0 ? `Crédito na vitória: ${formatMoney(activeMarketEffects.winCredit)}` : ''}</p></div>}
          </div>
        </section>
      );
    };

    const MainApp = () => {
      const { view, activeGame, setView, diffs, setDiffs, pushRecentGame } = useAppState();
      useEffect(() => {
        if (view === 'game' && activeGame && activeGame.id) pushRecentGame(activeGame.id);
      }, [view, activeGame]);
      const [menuOpen, setMenuOpen] = useState(false);
      const [sidebarHidden, setSidebarHidden] = useState(() => loadStore('berimbet_sidebar_hidden', false));
      const [adminOpen, setAdminOpen] = useState(false);
      const [showHelp, setShowHelp] = useState(false);

      useEffect(() => { saveStore('berimbet_sidebar_hidden', sidebarHidden); }, [sidebarHidden]);

      // Preserva a posição exata do lobby ao entrar em um jogo e restaura ao voltar.
      const previousView = useRef(view);
      useEffect(() => {
        if (previousView.current === 'game' && view === 'lobby') {
          restoreLobbyScroll();
        }
        if (view === 'game') {
          setMenuOpen(false);
        }
        previousView.current = view;
      }, [view]);

      const renderView = () => {
        if (view === 'lobby') return <Lobby />;
        if (view === 'market') return <Lobby marketOnly />;
        if (view === 'inventory') return <InventoryView />;
        if (view === 'history' || view === 'profile') return <ProfileView openAdmin={() => setAdminOpen(true)} />;
        if (view === 'game' && activeGame) {
          return (
            <div className="flex flex-col h-full min-h-[calc(100vh-8rem)]">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div className="flex flex-wrap items-center gap-x-4 gap-y-1 min-w-0">
                  <button onClick={() => setView('lobby')} className="text-slate-400 hover:text-white flex items-center gap-1"><Icon path={Icons.ChevronLeft} className="w-4 h-4" /> Voltar ao Lobby</button>
                  <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2 min-w-0">
                    <span>{activeGame.icon}</span> {activeGame.name}
                  </h2>
                </div>
                <button onClick={() => setShowHelp(!showHelp)} className="bg-slate-800 hover:bg-slate-700 text-amber-400 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 border border-amber-500/30">
                  <Icon path={Icons.Info} className="w-4 h-4" /> Como Jogar
                </button>
              </div>

              {showHelp && (
                <div className="bg-slate-900 border border-amber-500/40 rounded-xl p-4 mb-4 text-xs text-slate-300 space-y-2 leading-relaxed">
                  <div className="font-bold text-amber-400 text-sm border-b border-slate-800 pb-1">Instruções de Jogo: {activeGame.name}</div>
                  <div className="whitespace-pre-line">{activeGame.help || activeGame.desc}</div>
                </div>
              )}

              <div className="flex flex-wrap items-center gap-2 mb-4 text-xs">
                <span className="text-slate-400 font-bold">Dificuldade:</span>
                {Object.entries(DIFFS).map(([k, d]) => <button key={k} onClick={() => setDiffs({ ...diffs, [activeGame.id]: k })} className={cn("px-3 py-1.5 rounded-lg border font-bold", (diffs[activeGame.id] || 'normal') === k ? d.on : "bg-slate-900 border-slate-700 text-slate-400")}>{d.label}</button>)}
                <span className="text-slate-500 w-full md:w-auto">{DIFFS[diffs[activeGame.id] || 'normal'].desc}</span>
              </div>
              <div className="flex-1 game-surface">                 {['treasurehunt', 'safecracker', 'cardbattle'].includes(activeGame.engine || activeGame.id) && <GameAdditional key={activeGame.id} />}
                {(activeGame.engine || activeGame.id) === 'craps' && <GameCraps />}
                {(activeGame.engine || activeGame.id) === 'horses' && <GameHorses />}
                {(activeGame.engine || activeGame.id) === 'football' && <GameFootball />}
                {(activeGame.engine || activeGame.id) === 'fortunetiger' && <GameFortuneTiger />}
                {(activeGame.engine || activeGame.id) === 'fortunesnake' && <GameFortuneSnake />}
                {(activeGame.engine || activeGame.id) === 'fortuneox' && <GameFortuneOx />}
                {(activeGame.engine || activeGame.id) === 'fortunerabbit' && <GameFortuneRabbit />}
                {(activeGame.engine || activeGame.id) === 'fortunedragon' && <GameFortuneDragon />}
                {(activeGame.engine || activeGame.id) === 'crash' && <GameCrash />}
                {(activeGame.engine || activeGame.id) === 'mines' && <GameMines />}
                {(activeGame.engine || activeGame.id) === 'slots' && <GameSlots />}
                {(activeGame.engine || activeGame.id) === 'bacbo' && <GameBacBo />}
                {(activeGame.engine || activeGame.id) === 'blackjack' && <GameBlackjack />}
                {(activeGame.engine || activeGame.id) === 'roulette' && <GameRoulette />}
                {(activeGame.engine || activeGame.id) === 'baccarat' && <GameBaccarat />}
                {(activeGame.engine || activeGame.id) === 'plinko' && <GamePlinko />}
                {(activeGame.engine || activeGame.id) === 'aviator' && <GameAviator />}
                {(activeGame.engine || activeGame.id) === 'balloon' && <GameBalloon />}
                {(activeGame.engine || activeGame.id) === 'dice' && <GameDice />}
                {(activeGame.engine || activeGame.id) === 'coin' && <GameCoin />}
                {(activeGame.engine || activeGame.id) === 'bottles' && <GameBottles />}
                {(activeGame.engine || activeGame.id) === 'tower' && <GameTower />}
                {(activeGame.engine || activeGame.id) === 'stairs' && <GameStairs />}
                {(activeGame.engine || activeGame.id) === 'doubleornothing' && <GameDoubleOrNothing />}
                {(activeGame.engine || activeGame.id) === 'parouimpar' && <GameParOuImpar />}
                {(activeGame.engine || activeGame.id) === 'diceduel' && <GameDiceDuel />}
                {(activeGame.engine || activeGame.id) === 'overunder' && <GameOverUnder />}
                {(activeGame.engine || activeGame.id) === 'highlow' && <GameHighLow />}
                {(activeGame.engine || activeGame.id) === 'pokerflash' && <GamePokerFlash />}
                {(activeGame.engine || activeGame.id) === 'wheel' && <GameWheel />}
                {(activeGame.engine || activeGame.id) === 'scratch' && <GameScratch />}
                {(activeGame.engine || activeGame.id) === 'giftboxes' && <GameGiftBoxes />}
                {(activeGame.engine || activeGame.id) === 'keno' && <GameKeno />}
                {(activeGame.engine || activeGame.id) === 'fruitslots' && <GameFruitSlots />}
                {(activeGame.engine || activeGame.id) === 'bounce' && <GameBounce />}
                {(activeGame.engine || activeGame.id) === 'gravity' && <GameGravity />}
                {(activeGame.engine || activeGame.id) === 'tictactoe' && <GameTicTacToe />}
                {(activeGame.engine || activeGame.id) === 'maze' && <GameMaze />}
                {(activeGame.engine || activeGame.id) === 'board' && <GameBoard />}
                {(activeGame.engine || activeGame.id) === 'memory' && <GameMemory />}
                {(activeGame.engine || activeGame.id) === 'russian' && <GameRussian />}
                {(activeGame.engine || activeGame.id) === 'russianwheel' && <GameRussianWheel />}
              </div>
            </div>
          );
        }
        return <Lobby />;
      };

      const inGame = view === 'game' && !!activeGame;
      return (
        <div className="min-h-screen bg-transparent text-slate-200 font-sans flex relative z-[1]">
          {!inGame && <Sidebar isOpen={menuOpen} closeMenu={() => setMenuOpen(false)} hidden={sidebarHidden} toggleSidebar={() => setSidebarHidden(v => !v)} />}
          <div className={cn("main-sidebar-smooth min-h-screen flex flex-col w-full min-w-0", !inGame && !sidebarHidden && "md:ml-64")}>
            <Header toggleMenu={() => setMenuOpen(!menuOpen)} toggleSidebar={() => setSidebarHidden(v => !v)} sidebarHidden={sidebarHidden} inGame={inGame} />
            <main className="site-main-under-header flex-1 min-w-0 p-3 sm:p-4 md:p-8 overflow-x-hidden bg-transparent">{renderView()}</main>
          </div>
          <AdminModal isOpen={adminOpen} onClose={() => setAdminOpen(false)} />
          <DebugOverlay />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><MainApp /></AppProvider>);
  </script>

  <style id="game-card-fx">
    .game-card {
      position: relative;

      will-change: transform
    }

      --c: 34, 150, 110
    }

      --c: 176, 46, 66
    }

    .game-card.bg-slate-900.rounded-2xl {
      background: linear-gradient(165deg, #12100c 0%, #0a1612 62%, #0d0709 100%) !important;
      border-color: rgba(212, 175, 55, .24) !important
    }

    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity .4s ease;
      background: radial-gradient(70px circle at var(--mx, 50%) var(--my, 50%), rgba(var(--c), .1), transparent 100%)
    }

    .game-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 244, 205, .12) 50%, transparent 65%);
      transform: translateX(-120%)
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: rgba(var(--c), .85) !important;
      box-shadow: 0 16px 36px rgba(0, 0, 0, .6), 0 0 0 1px rgba(var(--c), .28), 0 0 28px rgba(var(--c), .22)
    }

    .game-card:hover::before {
      opacity: 1
    }

    .game-card:hover::after {
      opacity: 1;
      transform: translateX(120%);
      transition: transform .9s cubic-bezier(.22, 1, .36, 1)
    }

    .game-art {
      position: relative;
      height: 8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      font-weight: 900;
      color: rgb(var(--c));
      text-shadow: 0 0 22px rgba(var(--c), .4)

      transform: rotate(-14deg) scale(1.1)

      color: rgb(var(--c));
      opacity: .45;
      transition: transform .6s cubic-bezier(.22, 1, .36, 1), opacity .4s ease

    }

    .game-card:hover .game-btn {
      background: linear-gradient(180deg, rgba(var(--c), 1), rgba(var(--c), .78)) !important;

      box-shadow: 0 0 16px rgba(var(--c), .35)
    }

    @media (prefers-reduced-motion:reduce) {

      .game-card,
      .game-card * {
        transition: none !important
      }

      .game-card::after {
        display: none
      }
    }
  </style>

      left: 50%;
      top: -14px;
      width: 1px;
      height: 14px;
      background: rgba(212, 175, 55, .6);
    }

    .ft-l-left {
      left: 7%
    }

    .ft-l-right {
      right: 7%;
      animation-delay: -1.8s
    }

    @keyframes ftSwing {

      0%,
      100% {
        transform: rotate(-7deg)
      }

      50% {
        transform: rotate(7deg)
      }
    }

    .ft-title {
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 700;
      letter-spacing: .14em;
      font-size: 18px;
      background: linear-gradient(180deg, #fff3b0, #f0c14b 55%, #b4811f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .6));
    }

    .ft-sub {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #e9c46a;
      opacity: .85;
      min-height: 16px;
      margin-top: 2px;
    }

    .ft-sub.ft-banner {
      opacity: 1;
      color: #fff3b0;
      font-weight: 800;
      animation: ftBlink .5s ease-in-out infinite alternate;
    }

    @keyframes ftBlink {
      from {
        text-shadow: 0 0 4px rgba(255, 200, 60, .4)
      }

      to {
        text-shadow: 0 0 14px rgba(255, 200, 60, 1)
      }
    }

    .ft-board {
      position: relative;
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 7px;
      margin-top: 3px;
      border-radius: 18px;
      background: linear-gradient(180deg, #1a0505, #0a0202);
      box-shadow: 0 0 0 2px #b4811f, 0 0 0 4px rgba(0, 0, 0, .6), 0 0 24px rgba(212, 175, 55, .25), inset 0 0 30px rgba(0, 0, 0, .8);
    }

    .ft-board:after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 3;
      background: linear-gradient(180deg, rgba(0, 0, 0, .5), transparent 20%, transparent 80%, rgba(0, 0, 0, .5));
    }

    .ft-reel {
      position: relative;
      box-sizing: border-box;
      width: 70px;
      height: calc(var(--ftc)*3 + 2px);
      overflow: hidden;
      border-radius: 12px;
      background: linear-gradient(180deg, #2a0a0a, #160505);
      border: 1px solid rgba(212, 175, 55, .35);
    }

    .ft-reel-locked {
      border-color: #ffd24a;
      box-shadow: 0 0 18px rgba(255, 190, 60, .7), inset 0 0 22px rgba(255, 170, 40, .35);
    }

    .ft-reel-locked:after {
      content: "TRAVADO";
      position: absolute;
      top: 2px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 7px;
      letter-spacing: .18em;
      color: #ffe08a;
      font-weight: 800;
      z-index: 4;
    }

    .ft-cell {
      height: var(--ftc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--ftc)*.52);
      position: relative;
      border-bottom: 1px solid rgba(212, 175, 55, .12);
      animation: ftLand .38s cubic-bezier(.2, .9, .3, 1.3);
    }

    .ft-cell:last-child {
      border-bottom: 0
    }

    @keyframes ftLand {
      0% {
        transform: translateY(-22px);
        opacity: .4
      }

      100% {
        transform: translateY(0);
        opacity: 1
      }
    }

    .ft-wild {
      background: radial-gradient(circle, rgba(255, 150, 30, .35), transparent 70%);
      animation: ftWild 1.4s ease-in-out infinite;
    }

    .ft-wild:after {
      content: "WILD";
      position: absolute;
      bottom: 3px;
      font-size: 8px;
      letter-spacing: .2em;
      color: #ffd978;
      font-weight: 800;
      font-family: system-ui, sans-serif;
    }

    @keyframes ftWild {

      0%,
      100% {
        filter: drop-shadow(0 0 4px rgba(255, 160, 40, .4))
      }

      50% {
        filter: drop-shadow(0 0 12px rgba(255, 190, 60, .95))
      }
    }

    .ft-hit {
      background: radial-gradient(circle, rgba(255, 215, 90, .4), transparent 72%);
      animation: ftHit .7s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes ftHit {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.14)
      }
    }

    .ft-strip {
      animation: ftScroll .5s linear infinite;
      filter: blur(1.2px);
    }

    @keyframes ftScroll {
      from {
        transform: translateY(-50%)
      }

      to {
        transform: translateY(0)
      }
    }

    .ft-info {
      min-height: 22px;
      margin-top: 5px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .ft-wintext {
      color: #ffe08a;
      text-shadow: 0 0 12px rgba(255, 190, 60, .6)
    }

    .ft-muted {
      color: #c9b98a;
      font-weight: 600;
      font-size: 12px
    }

    .ft-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 4px;
      font-size: 10px;
    }

    .ft-chip {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(212, 175, 55, .35);
      background: rgba(0, 0, 0, .35);
      color: #f3e3b0;
    }

    .ft-note {
      margin-top: 4px;
      font-size: 9px;
      line-height: 1.5;
      color: #b9a97c;
    }

    .ft-spin {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      color: #2a0707;
      background: linear-gradient(180deg, #ffe08a, #e0a82e 60%, #b8801a);
      box-shadow: 0 0 18px rgba(212, 175, 55, .4), inset 0 1px 0 rgba(255, 255, 255, .5);
      transition: filter .15s, transform .1s;
    }

    .ft-spin:hover:not(:disabled) {
      filter: brightness(1.08)
    }

    .ft-spin:active:not(:disabled) {
      transform: scale(.98)
    }

    .ft-spin:disabled {
      opacity: .6;
      cursor: not-allowed
    }

    .ft-rain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 6;
    }

    .ft-coin {
      position: absolute;
      top: -30px;
      font-size: 24px;
      animation: ftFall linear forwards;
    }

    @keyframes ftFall {
      0% {
        transform: translateY(0) rotate(0);
        opacity: 1
      }

      100% {
        transform: translateY(620px) rotate(540deg);
        opacity: .9
      }
    }

    .ft-bigwin {
      position: absolute;
      left: 0;
      right: 0;
      top: 48%;
      z-index: 7;
      pointer-events: none;
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 800;
      font-size: 22px;
      color: #fff3b0;
      text-shadow: 0 0 18px rgba(255, 170, 30, .9), 0 3px 0 #7a5410;
      animation: ftBig 2.4s ease-out forwards;
    }

    .ft-bigwin b {
      display: block;
      font-size: 25px
    }

    @keyframes ftBig {
      0% {
        transform: translateY(-50%) scale(.3);
        opacity: 0
      }

      15% {
        transform: translateY(-50%) scale(1.15);
        opacity: 1
      }

      25% {
        transform: translateY(-50%) scale(1)
      }

      80% {
        transform: translateY(-50%) scale(1);
        opacity: 1
      }

      100% {
        transform: translateY(-50%) scale(1);
        opacity: 0
      }
    }

    @media (max-width:420px) {
      .ft-wrap {
        --ftc: 56px
      }

      .ft-reel {
        width: 62px
      }

      .ft-tiger {
        font-size: 54px
      }

      .ft-title {
        font-size: 16px
      }
    }

    .ft-noanim *,
    .ft-noanim *:before,
    .ft-noanim *:after {
      animation: none !important
    }

    @media (prefers-reduced-motion:reduce) {

      .ft-wrap *,
      .ft-wrap *:before,
      .ft-wrap *:after {
        animation: none !important
      }
    }
  </style>

  <style id="fixed-site-header">
    .site-header-fixed {
      position: fixed !important;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }

    /* em desktop, alinha o header com a coluna principal quando a sidebar está aberta */
    @media (min-width: 768px) {

      .main-sidebar-smooth.md\:ml-64 .site-header-fixed,
      .main-sidebar-smooth:not(.md\:ml-64) .site-header-fixed {
        /* left is set via JS-less approach: header is inside the column that already has margin */
      }

      .main-sidebar-smooth .site-header-fixed {
        left: inherit;
        width: inherit;
        max-width: 100%;
      }
    }

    /* header is child of the main column — fixed relative to viewport needs left offset when sidebar open */
    .main-sidebar-smooth.md\:ml-64>.site-header-fixed {
      left: 16rem;
      /* w-64 */
      width: calc(100% - 16rem);
    }

    .main-sidebar-smooth>.site-header-fixed {
      left: 0;
      width: 100%;
    }

    @media (min-width: 768px) {
      .main-sidebar-smooth.md\:ml-64>.site-header-fixed {
        left: 16rem;
        width: calc(100% - 16rem);
      }
    }

    @media (max-width: 767px) {
      .main-sidebar-smooth.md\:ml-64>.site-header-fixed {
        left: 0;
        width: 100%;
      }
    }

    .site-main-under-header {
      padding-top: calc(0.75rem + 3.5rem) !important;
      /* space for fixed header h-14 */
    }

    @media (min-width: 640px) {
      .site-main-under-header {
        padding-top: calc(1rem + 4rem) !important;
        /* h-16 */
      }
    }

    @media (min-width: 768px) {
      .site-main-under-header {
        padding-top: calc(2rem + 4rem) !important;
      }
    }
  </style>
